<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>付款记录 - Freed</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; min-height:100%;
  background: linear-gradient(180deg, #0d2a55 0%, #0a1d3f 100%);
  font-family: 'Noto Sans SC', sans-serif;
}
#back-btn {
  position: fixed;
  top: max(22px, calc(env(safe-area-inset-top, 0px) + 8px));
  left: 16px;
  z-index: 50;
  height: 36px;
  padding: 0 16px;
  border-radius: 99px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  color: rgba(230,245,255,0.92);
  font-size: 0.82rem;
  letter-spacing: 0.04em;
}
#back-btn:active { background: rgba(255,255,255,0.25); }

.page {
  max-width: 480px;
  margin: 0 auto;
  padding: 80px 16px 40px;
}
.page h1 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  font-size: 1.15rem;
  color: rgba(235,245,255,0.97);
  letter-spacing: 0.08em;
  text-align: center;
  margin-bottom: 6px;
}
.page .sub {
  text-align: center;
  font-size: 0.72rem;
  color: rgba(200,220,245,0.6);
  margin-bottom: 24px;
}

#state-loading, #state-empty, #state-error {
  text-align: center;
  color: rgba(210,230,250,0.75);
  font-size: 0.82rem;
  padding: 40px 20px;
}

.record-list { display: flex; flex-direction: column; gap: 10px; }
.record-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(140,190,255,0.18);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.record-left { display: flex; flex-direction: column; gap: 4px; }
.record-date {
  font-size: 0.78rem;
  color: rgba(220,235,250,0.92);
}
.record-tags {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.record-tag {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 99px;
  background: rgba(74,159,212,0.22);
  color: rgba(180,225,250,0.95);
  white-space: nowrap;
}
.record-tag.method {
  background: rgba(58,184,160,0.20);
  color: rgba(170,240,220,0.95);
}
.record-right {
  font-size: 1.02rem;
  color: rgba(235,245,255,0.97);
  white-space: nowrap;
  padding-left: 12px;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<button id="back-btn" onclick="window.location.href='web.html'">返回</button>

<div class="page">
  <h1>付款记录</h1>
  <div class="sub">查看你的历史订阅与付款明细</div>

  <div id="state-loading">加载中...</div>
  <div id="state-empty" style="display:none;">暂无付款记录</div>
  <div id="state-error" style="display:none;">加载失败，请稍后重试</div>
  <div id="record-list" class="record-list"></div>
</div>

<script>
(function() {
  const SUPABASE_URL = 'https://ryoaxziysgdkjcjiuqti.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5b2F4eml5c2dka2pjaml1cXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDg2MDAsImV4cCI6MjA4OTA4NDYwMH0.ORG_8Ue8LjYfReMvKo1iQOFNGN7fcTz1_fMs8Gq1Kds';
  const WORKER_URL = 'https://api.freedreleasing.com';

  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sb-ryoaxziysgdkjcjiuqti-auth-token' }
  });

  const PLAN_LABELS = { monthly: '月度会员', quarterly: '季度会员', yearly: '年度会员' };
  const METHOD_LABELS = {
    card: '信用卡',
    alipay: '支付宝',
    wechat_pay: '微信支付',
    alipay_or_wechat: '微信 / 支付宝',
  };
  const CURRENCY_SYMBOLS = { usd:'$', cad:'$', gbp:'£', aud:'$', nzd:'$', jpy:'¥', krw:'₩', sgd:'$', myr:'RM', hkd:'$', twd:'NT$', cny:'¥' };

  function formatAmount(amount, currency) {
    if (amount == null || !currency) return '—';
    const symbol = CURRENCY_SYMBOLS[currency.toLowerCase()] || '';
    // Stripe 金额单位是最小货币单位（比如分），日元/韩元本身没有小数位
    const noDecimalCurrencies = ['jpy', 'krw'];
    const value = noDecimalCurrencies.includes(currency.toLowerCase()) ? amount : amount / 100;
    const formatted = Number.isInteger(value) ? String(value) : value.toFixed(2);
    return symbol + formatted;
  }

  function formatDate(iso) {
    if (!iso) return '未知时间';
    const d = new Date(iso);
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  }

  function renderItems(items) {
    const loadingEl = document.getElementById('state-loading');
    const emptyEl = document.getElementById('state-empty');
    const listEl = document.getElementById('record-list');
    loadingEl.style.display = 'none';

    if (!items || items.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }

    listEl.innerHTML = items.map(function(item) {
      const planLabel = PLAN_LABELS[item.plan] || item.plan || '会员';
      const methodLabel = METHOD_LABELS[item.payment_method] || '—';
      return '<div class="record-card">' +
        '<div class="record-left">' +
          '<div class="record-date">' + formatDate(item.date) + '</div>' +
          '<div class="record-tags">' +
            '<span class="record-tag">' + planLabel + '</span>' +
            '<span class="record-tag method">' + methodLabel + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="record-right">' + formatAmount(item.amount, item.currency) + '</div>' +
      '</div>';
    }).join('');
  }

  function showError() {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-error').style.display = 'block';
  }

  async function loadHistory() {
    try {
      const { data: { session } } = await supa.auth.getSession();
      if (!session) {
        window.location.href = 'web.html?login=1&redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      const res = await fetch(WORKER_URL + '/billing/history', {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + session.access_token },
      });
      if (!res.ok) { showError(); return; }
      const data = await res.json();
      renderItems(data.items);
    } catch (err) {
      showError();
    }
  }

  loadHistory();
})();
</script>

</body>
</html>
