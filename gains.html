<script>
(function() {
var canvas = document.createElement('canvas');
canvas.id = 'bgCanvas';
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;
const EMOTION_COLORS = [{r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},{r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},{r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224}];
class Bubble {
  constructor(fromBottom) { this.reset(fromBottom); }
  reset(startAtBottom) {
    this.x=Math.random()*W; this.y=startAtBottom?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2); this.vx=0;
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30);
    this.color=EMOTION_COLORS[Math.floor(Math.random()*EMOTION_COLORS.length)];
  }
  update(t) {
    this.life++;
    this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp;
    this.y+=this.vy;
    const progress=this.life/this.maxLife;
    if(progress<0.08) this.opacity=(progress/0.08)*(0.25+Math.random()*0.01);
    else if(progress>0.85) this.opacity*=0.97;
    if(this.y<-this.r*3||this.life>this.maxLife) this.reset(true);
  }
  draw() {
    const x=this.x,y=this.y,r=this.r,a=this.opacity,{r:cr,g:cg,b:cb}=this.color;
    const glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,`rgba(${cr},${cg},${cb},${a*0.65})`);
    glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    const shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0.00,`rgba(255,255,255,${a*0.70})`);
    shell.addColorStop(0.12,`rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55,`rgba(${cr},${cg},${cb},${a*0.48})`);
    shell.addColorStop(0.82,`rgba(${cr},${cg},${cb},${a*0.62})`);
    shell.addColorStop(1.00,`rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a*0.90})`;
    ctx.lineWidth=Math.max(0.5,r*0.06);ctx.stroke();
    const sp=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0,`rgba(255,255,255,${Math.min(1,a*1.6)})`);
    sp.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
    const sp2=ctx.createRadialGradient(x+r*0.38,y+r*0.30,0,x+r*0.38,y+r*0.30,r*0.14);
    sp2.addColorStop(0,`rgba(255,255,255,${a*0.38})`);
    sp2.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp2;ctx.fill();
  }
}
const BUBBLES=Array.from({length:55},(_,i)=>new Bubble(i>20));
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function draw(){
  requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');
  bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  BUBBLES.forEach(function(b){b.update(t);b.draw();});
}
window.addEventListener('resize',resize);resize();draw();
})();
</script>

function showToast(msg) {

}
async function supaFetch(path,opts={}) {
  let token=SUPA_KEY;
  if(opts.useAuth){try{const sess=await supaAuth.auth.getSession();const t=sess&&sess.data&&sess.data.session&&sess.data.session.access_token;if(t)token=t;}catch(_){}delete opts.useAuth;}
  const res=await fetch(SUPA_URL+path,{...opts,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
  if(!res.ok)return null;
  const ct=res.headers.get('content-type')||'';
  return ct.includes('json')?res.json():res.text();
}

function renderGainList(el,items,isShared) {
  if(!items.length){const t=isShared?'收获墙还是空的，成为第一个贴上去的人吧 🌟':'还没有记录，写下第一条收获吧 🌊';el.innerHTML='<li class="gain-empty" style="padding:20px 0;text-align:center;color:#8aaac0;font-size:0.78rem;">'+t+'</li>';return;}
  el.innerHTML=items.map(function(item){
    const icon=CAT_ICONS[item.cat]||'🌸';
    const badge=item.cat?'<span class="gain-badge">'+icon+' '+item.cat+'</span>':'';
    const likes=item.likes||0;
    if(isShared){
      const itemId=item.id+'';const liked=likedKeys.has(itemId);
      const likeBtn='<button class="gain-like-btn '+(liked?'liked':'')+'" onclick="likeGain(\''+item.id+'\', this)">'+(liked?'❤️':'🤍')+' <span class="gain-like-count">'+(likes>0?likes:'赞')+'</span></button>';
      const isOwn=currentUser&&item.user_id&&item.user_id===currentUser.id;
      const moreBtn=isOwn?'<button class="gain-warn-btn" onclick="openMyPublicMenu(\''+item.id+'\')">⋯</button>':(currentUser&&item.user_id&&item.user_id!==currentUser.id?'<button class="gain-warn-btn" onclick="openWarnMenu(\''+item.id+'\', \''+item.user_id+'\')">⋯</button>':'');
      return '<li class="gain-item shared"><span class="gain-text">'+escapeHtml(item.text)+'</span><div class="gain-footer"><div style="display:flex;align-items:center;gap:6px;">'+badge+'<span class="gain-meta">'+formatRelTime(item.ts)+'</span></div><div style="display:flex;align-items:center;gap:4px;">'+likeBtn+moreBtn+'</div></div></li>';
    }
    const isAlreadyShared=currentUser&&cachedSharedIds.has(String(item.id));
    const likeStr=likes>0?' ❤️ '+likes:'';
    const shareBtn=currentUser?(isAlreadyShared?'<button class="gain-share-btn shared" disabled>🌟 已上墙'+likeStr+'</button>':'<button class="gain-share-btn" onclick="shareGain(\''+item.id+'\', this)">📝 贴上收获墙</button>'):'';
    return '<li class="gain-item"><span class="gain-text">'+escapeHtml(item.text)+'</span><div class="gain-footer"><div style="display:flex;align-items:center;gap:6px;">'+badge+'<span class="gain-meta">'+formatRelTime(item.ts)+'</span></div><div style="display:flex;align-items:center;gap:6px;">'+shareBtn+'</div></div></li>';
  }).join('');
}

let cachedMyItems=null;
let cachedSharedIds=new Set();

async function loadMyData() {
  const myEl=document.getElementById('myGainListSb');
  const myTitleEl=document.getElementById('myGainTitleSb');
  let myItems=[];
  if(currentUser){
    myEl.innerHTML='<li class="gain-loading">加载中…</li>';
    try{
      const [rows,sharedRows]=await Promise.all([
        supaFetch('/rest/v1/gain_entries?user_id=eq.'+currentUser.id+'&select=*&order=ts.desc&limit='+GAIN_MAX),
        supaFetch('/rest/v1/gain_public?user_id=eq.'+currentUser.id+'&select=id&limit=1000'),
      ]);
      myItems=rows||[];
      cachedSharedIds=new Set((sharedRows||[]).map(r=>String(r.id)));
    }catch(e){myItems=[];}
  }else{myItems=getMyItems();cachedSharedIds=new Set();}
  cachedMyItems=myItems;
  if(myTitleEl)myTitleEl.textContent=tf('my_gains',myItems.length);
  renderGainList(myEl,myItems,false);
  renderStatsFromCache();
  loadEmotionChart();
}

async function loadMyGains(){return loadMyData();}

async function shareGain(entryId,btn) {
  if(!currentUser)return;
  btn.disabled=true;btn.textContent='分享中…';
  const item=(cachedMyItems||[]).find(it=>String(it.id)===String(entryId));
  if(!item){btn.disabled=false;btn.textContent='📝 贴上收获墙';showToast('找不到这条收获，请刷新后重试');return;}
  try{
    await supaFetch('/rest/v1/gain_public',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:item.id,text:item.text,cat:item.cat,ts:item.ts,likes:item.likes||0,user_id:currentUser.id}),useAuth:true});
    cachedSharedIds.add(String(entryId));btn.textContent='🌟 已上墙';btn.classList.add('shared');btn.disabled=true;showToast('🌟 已贴上收获墙，鼓励了更多人');
  }catch(e){btn.disabled=false;btn.textContent='📝 贴上收获墙';showToast('贴上失败，请重试');}
}

async function loadSharedGains() {
  const sharedEl=document.getElementById('sharedGainListSb');
  const titleEl=document.getElementById('sharedGainTitleSb');
  sharedEl.innerHTML='<li class="gain-loading">加载中…</li>';
  try{
    const order=gainSortSb==='likes'?'likes.desc,ts.desc':'ts.desc';
    let url=`/rest/v1/gain_public?select=*&order=${order}&limit=${GAIN_MAX}`;
    if(gainSelectedFilterSb!=='all')url+=`&cat=eq.${encodeURIComponent(gainSelectedFilterSb)}`;
    let items=await supaFetch(url);
    const blockedUsers=getBlockedUsers();const reportedIds=getReportedIds();
    items=(items||[]).filter(it=>{if(it.user_id&&blockedUsers.indexOf(it.user_id)!==-1)return false;if(it.id&&reportedIds.indexOf(it.id+'')!==-1)return false;return true;});
    if(titleEl)titleEl.textContent=tf('shared_gains',items.length);
    renderGainList(sharedEl,items,true);
  }catch(e){sharedEl.innerHTML='<li class="gain-empty">加载失败</li>';}
}

const BANNED_WORDS=['傻逼','沙比','煞笔','傻x','sb','智障','脑残','废物','贱人','婊子','狗东西','畜生','滚蛋','去死','该死','王八蛋','混蛋','操你','草你','日你','fuck','shit','bitch','asshole','idiot','色情','黄片','av','做爱','性交','裸照','约炮','一夜情','卖淫','嫖娼','阴茎','阴道','性器','自慰','发骚','骚货','淫','杀人','砍死','打死','血腥','自杀','自残','炸弹','枪支','贩毒','吸毒','加微信','加我vx','加qq','扫码','返利','代理','刷单','兼职日入','博彩','赌博','彩票','贷款','办卡','引流','推广加','点击链接','www.','.com','.cn','.net'];
function checkContent(text){if(!text)return{ok:true};const lower=text.toLowerCase();for(let i=0;i<BANNED_WORDS.length;i++){const w=BANNED_WORDS[i].toLowerCase();if(w&&lower.indexOf(w)!==-1)return{ok:false,word:BANNED_WORDS[i]};}return{ok:true};}

async function submitGainSb(){
  const input=document.getElementById('gainInputSb');const text=input.value.trim();if(!text)return;
  const check=checkContent(text);if(!check.ok){showToast('内容含有不当词汇，请修改后再发布');return;}
  input.value='';await _submitGainEntry(text,gainSelectedCat);showToast(tf('gain_recorded',gainSelectedCat));
  cachedMyItems=null;if(activeGainTab==='mine')loadMyData();
}
async function _submitGainEntry(text,cat){
  const ts=Date.now();const entry={text,cat,ts,likes:0};if(currentUser)entry.user_id=currentUser.id;
  const myItems=getMyItems();myItems.unshift({text,cat,ts,likes:0});saveMyItems(myItems);
  try{await supaFetch('/rest/v1/gain_entries',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(entry),useAuth:!!currentUser});}catch(_){}
}

async function likeGain(id,btn){
  if(likedKeys.has(id+''))return;likedKeys.add(id+'');btn.classList.add('liked');btn.innerHTML='❤️ <span class="gain-like-count">…</span>';
  try{const rows=await supaFetch(`/rest/v1/gain_entries?id=eq.${id}&select=likes`);const current=(rows&&rows[0])?(rows[0].likes||0):0;const newLikes=current+1;await supaFetch(`/rest/v1/gain_entries?id=eq.${id}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({likes:newLikes})});btn.querySelector('.gain-like-count').textContent=newLikes;}catch(e){btn.querySelector('.gain-like-count').textContent='赞';}
}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatRelTime(ts){const diff=Date.now()-ts;if(diff<60000)return'刚刚';if(diff<3600000)return Math.floor(diff/60000)+' 分钟前';if(diff<86400000)return Math.floor(diff/3600000)+' 小时前';return Math.floor(diff/86400000)+' 天前';}
function formatDate(ts){const d=new Date(ts);return(d.getMonth()+1)+' 月 '+d.getDate()+' 日';}
function daysSince(ts){return Math.floor((Date.now()-ts)/86400000);}

function renderStatsFromCache(){
  if(!currentUser){setStatsCardForLoggedOut();return;}
  const card=document.getElementById('statsCard');
  const isLoggedOutLayout=!card.querySelector('#statsBody');
  if(isLoggedOutLayout)setStatsCardForLoggedIn();
  const body=document.getElementById('statsBody');if(!body)return;
  const items=(cachedMyItems||[]).slice().sort((a,b)=>a.ts-b.ts);const total=items.length;
  if(total===0){body.innerHTML='<div class="stats-empty">写下第一条收获，开启你的释放之旅 🌸</div>';return;}
  const firstTs=items[0].ts;const lastTs=items[items.length-1].ts;
  const journeyDays=Math.max(1,daysSince(firstTs)+1);const lastDays=daysSince(lastTs);
  let topCat=null;
  if(total>=3){const counts={};items.forEach(it=>{const c=it.cat||'其他';counts[c]=(counts[c]||0)+1;});let max=0,best=null;Object.keys(counts).forEach(k=>{if(counts[k]>max){max=counts[k];best=k;}});if(best)topCat=best;}
  const weeks=Math.max(1,journeyDays/7);const perWeek=(total/weeks).toFixed(1).replace(/\.0$/,'');
  let lastDesc;if(lastDays===0)lastDesc='今天';else if(lastDays===1)lastDesc='昨天';else lastDesc=lastDays+' 天前';
  let html='';
  html+='<div class="stats-line">• 你已经记录了 <strong>'+total+'</strong> 条收获 🌸</div>';
  html+='<div class="stats-line">• 释放之旅持续 <strong>'+journeyDays+'</strong> 天 🌊</div>';
  html+='<div class="stats-line">• 第一次释放是 <strong>'+formatDate(firstTs)+'</strong> 🌸</div>';
  html+='<div class="stats-line">• 上次释放是 <strong>'+lastDesc+'</strong> ✨</div>';
  if(topCat){const icon=CAT_ICONS[topCat]||'✨';html+='<div class="stats-line">• <strong>'+topCat+'</strong> 是你最深的成长 '+icon+'</div>';}
  html+='<div class="stats-line">• 平均每周释放 <strong>'+perWeek+'</strong> 次 🌊</div>';
  body.innerHTML=html;
}
async function renderStats(){renderStatsFromCache();}

function readUserFromLocalStorage(){
  try{
    const raw=localStorage.getItem('sb-ryoaxziysgdkjcjiuqti-auth-token');if(!raw)return null;
    const obj=JSON.parse(raw);const token=obj&&obj.access_token;if(!token)return null;
    const parts=token.split('.');if(parts.length!==3)return null;
    const payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(!payload||!payload.sub)return null;if(payload.exp&&payload.exp*1000<Date.now())return null;
    return{id:payload.sub,email:payload.email||''};
  }catch(_){return null;}
}
async function refreshUser(){
  const localUser=readUserFromLocalStorage();if(localUser){currentUser=localUser;return;}
  try{const{data}=await supaAuth.auth.getSession();const session=(data&&data.session)||null;currentUser=(session&&session.user)||null;}catch(_){currentUser=null;}
}

supaAuth.auth.onAuthStateChange(async(event,session)=>{

});

let gAuthTab='login';
function $g(id){return document.getElementById(id);}
function showAuthMsgG(text,type){const el=$g('g-auth-msg');el.textContent=text;el.className='auth-msg-g '+(type||'');}
function clearAuthMsgG(){const el=$g('g-auth-msg');el.textContent='';el.className='auth-msg-g';}
window.openAuthG=function(){clearAuthMsgG();$g('auth-overlay-gains').classList.add('show');};
window.closeAuthG=function(){$g('auth-overlay-gains').classList.remove('show');};
window.switchAuthTabG=function(tab){gAuthTab=tab;clearAuthMsgG();$g('g-tab-login').classList.toggle('active',tab==='login');$g('g-tab-signup').classList.toggle('active',tab==='signup');$g('g-auth-nickname').style.display=(tab==='signup')?'block':'none';$g('g-auth-submit-btn').textContent=(tab==='signup')?'注 册':'登 录';};
window.doAuthSubmitG=async function(){
  const email=$g('g-auth-email').value.trim();const password=$g('g-auth-password').value;const nickname=$g('g-auth-nickname').value.trim();
  if(!email||!password){showAuthMsgG('请填写邮箱和密码','error');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showAuthMsgG('邮箱格式不正确','error');return;}
  if(password.length<6){showAuthMsgG('密码至少 6 位','error');return;}
  if(gAuthTab==='signup'&&!nickname){showAuthMsgG('请填写昵称','error');return;}
  const btn=$g('g-auth-submit-btn');btn.disabled=true;const orig=btn.textContent;btn.textContent='请稍候…';clearAuthMsgG();
  try{
    if(gAuthTab==='signup'){
      const{data,error}=await supaAuth.auth.signUp({email,password});if(error)throw error;
      if(data.user){try{await supaAuth.from('user_profiles').insert({id:data.user.id,nickname:nickname});}catch(_){}}
      showAuthMsgG('注册成功 🌊','success');setTimeout(()=>closeAuthG(),800);
    }else{
      const{error}=await supaAuth.auth.signInWithPassword({email,password});if(error)throw error;
      showAuthMsgG('登录成功 ✨','success');setTimeout(()=>closeAuthG(),600);
    }
  }catch(err){
    let msg=err.message||'操作失败';
    if(msg.includes('Invalid login credentials'))msg='邮箱或密码错误';
    else if(msg.includes('User already registered'))msg='该邮箱已注册，请直接登录';
    else if(msg.includes('Password should be'))msg='密码至少 6 位';
    else if(msg.includes('Email rate limit'))msg='请求过于频繁，请稍后再试';
    showAuthMsgG(msg,'error');
  }finally{btn.disabled=false;btn.textContent=orig;}
};

function applyLoginGate(){

(async function init(){

// ════════════════════════════════════════
// 情绪趋势图
// ════════════════════════════════════════
var EMOTION_LABELS=['万念俱灰','悲苦','恐惧','贪求','愤怒','自尊自傲','无畏','接纳','平和'];
var BUBBLE_COLORS={1:'#6b7ab8',2:'#5b8fc9',3:'#8b6bb5',4:'#d4923a',5:'#d45a3a',6:'#c9a800',7:'#3ab8c9',8:'#5ab85a',9:'#8ab8d4'};
var emotionTab='week';
var emotionBubbles=[];
var emotionAnimId=null;
var ecollapsed=false;

function toggleEmotionCard(){
  ecollapsed=!ecollapsed;
  var body=document.getElementById('emotionBody');
  var toggle=document.getElementById('emotionToggle');
  body.style.maxHeight=ecollapsed?'0':'600px';
  body.style.opacity=ecollapsed?'0':'1';
  body.style.marginTop=ecollapsed?'0':'10px';
  toggle.style.transform=ecollapsed?'rotate(-90deg)':'';
}
function setEmotionTab(tab){
  emotionTab=tab;
  ['week','month','three','all'].forEach(function(t){var btn=document.getElementById('etab-'+t);if(btn)btn.classList.toggle('active',t===tab);});
  loadEmotionChart();
}
async function loadEmotionChart(){
  if(!currentUser)return;
  var canvas=document.getElementById('emotionCanvas');
  var empty=document.getElementById('emotionEmpty');
  if(!canvas)return;
  var now=new Date(),since;
  if(emotionTab==='week')since=new Date(now-7*86400000);
  else if(emotionTab==='month')since=new Date(now-30*86400000);
  else if(emotionTab==='three')since=new Date(now-90*86400000);
  else since=new Date(2024,0,1);
  try{
    var rows=await supaFetch('/rest/v1/daily_checkins?user_id=eq.'+currentUser.id+'&checked_at=gte.'+since.toISOString()+'&order=checked_at.asc&limit=200', {useAuth: true});
    if(!rows||rows.length===0){canvas.style.display='none';empty.style.display='block';return;}
    canvas.style.display='block';empty.style.display='none';
    drawEmotionChart(canvas,rows);
  }catch(e){console.error('emotion chart error',e);}
}
function drawEmotionChart(canvas,rows){
  var W=canvas.offsetWidth,H=220;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  var PAD_LEFT=54,PAD_RIGHT=12,PAD_TOP=12,PAD_BOTTOM=28;
  function levelToY(lv){return PAD_TOP+(H-PAD_TOP-PAD_BOTTOM)*(1-(lv-1)/8);}
  function idxToX(i,n){if(n===1)return PAD_LEFT+(W-PAD_LEFT-PAD_RIGHT)/2;return PAD_LEFT+(i/(n-1))*(W-PAD_LEFT-PAD_RIGHT);}
  var n=rows.length;
  var dates=rows.map(function(r){var d=new Date(r.checked_at);return(d.getMonth()+1)+'/'+d.getDate();});
  var step=Math.max(1,Math.ceil(n/7));
  if(emotionAnimId)cancelAnimationFrame(emotionAnimId);
  emotionBubbles=[];
  for(var i=0;i<n;i++){emotionBubbles.push({x:idxToX(i,n),targetY:levelToY(rows[i].emotion_level),level:rows[i].emotion_level,isRelease:rows[i].source==='release',phase:Math.random()*Math.PI*2,amp:1.8+Math.random()*1.2,alpha:0,born:Date.now()-i*50});}
  var t=0;
  function frame(){
    emotionAnimId=requestAnimationFrame(frame);t+=0.018;
    ctx.clearRect(0,0,W,H);
    ctx.font='11px sans-serif';ctx.textAlign='right';
    for(var i=1;i<=9;i++){var y=levelToY(i);ctx.fillStyle='rgba(90,120,160,0.65)';ctx.fillText(EMOTION_LABELS[i-1],PAD_LEFT-4,y+3);ctx.beginPath();ctx.moveTo(PAD_LEFT,y);ctx.lineTo(W-PAD_RIGHT,y);ctx.strokeStyle='rgba(0,0,0,0.05)';ctx.lineWidth=1;ctx.stroke();}
    ctx.textAlign='center';ctx.fillStyle='rgba(90,120,160,0.7)';
    for(var i=0;i<n;i+=step)ctx.fillText(dates[i],idxToX(i,n),H-6);
    ctx.beginPath();var started=false;
    emotionBubbles.forEach(function(b){if(b.isRelease)return;if(!started){ctx.moveTo(b.x,b.targetY);started=true;}else ctx.lineTo(b.x,b.targetY);});
    ctx.strokeStyle='rgba(91,143,201,0.28)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
    emotionBubbles.forEach(function(b){
      var age=(Date.now()-b.born)/350;b.alpha=Math.min(1,age);
      var y=b.targetY+Math.sin(t*55*0.018+b.phase)*b.amp;
      var a=b.alpha,color=BUBBLE_COLORS[b.level]||'#888';
      var cr=parseInt(color.slice(1,3),16),cg=parseInt(color.slice(3,5),16),cb=parseInt(color.slice(5,7),16);
      var r=b.isRelease?9:7,x=b.x;
      var glow=ctx.createRadialGradient(x,y,r*0.3,x,y,r*1.6);
      glow.addColorStop(0,'rgba('+cr+','+cg+','+cb+','+a*0.32+')');glow.addColorStop(1,'rgba('+cr+','+cg+','+cb+',0)');
      ctx.beginPath();ctx.arc(x,y,r*1.6,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
      var shell=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.01,x,y,r);
      shell.addColorStop(0,'rgba(255,255,255,'+a*0.78+')');shell.addColorStop(0.55,'rgba('+cr+','+cg+','+cb+','+a*0.45+')');shell.addColorStop(1,'rgba('+cr+','+cg+','+cb+','+a*0.80+')');
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='rgba('+cr+','+cg+','+cb+','+a*0.85+')';ctx.lineWidth=r*0.07;ctx.stroke();
      if(b.isRelease){ctx.beginPath();ctx.arc(x,y,r+2.5,0,Math.PI*2);ctx.strokeStyle='rgba(212,160,23,'+a*0.85+')';ctx.lineWidth=1.2;ctx.stroke();}
      var sp=ctx.createRadialGradient(x-r*0.32,y-r*0.32,0,x-r*0.28,y-r*0.28,r*0.3);
      sp.addColorStop(0,'rgba(255,255,255,'+Math.min(1,a*1.5)+')');sp.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
    });
  }
  frame();
}
</script>
