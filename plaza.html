<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height:100vh; background:transparent; font-family:'Noto Serif SC',serif; padding:80px 16px 32px; }

.back-btn {
  position:fixed; top:20px; left:16px; z-index:999;
  padding:8px 18px; border-radius:99px; border:none;
  background:rgba(255,255,255,0.75); backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(0,60,120,0.15);
  cursor:pointer; font-size:0.82rem; color:#2a6090;
  font-family:'Noto Sans SC',sans-serif;
  transition:background 0.18s;
}
.back-btn:hover { background:rgba(255,255,255,0.95); }

.page-wrap { max-width:600px; margin:0 auto; background:rgba(255,255,255,0.75); border-radius:20px; padding:20px 16px; box-shadow:0 8px 32px rgba(0,60,120,0.10); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.85); }

/* 轮播分类 */
.carousel-wrap { position:relative; overflow:hidden; padding:0; margin-bottom:16px; }
.carousel {
  display:flex; gap:24px;
  overflow-x:auto; scroll-snap-type:x mandatory;
  scrollbar-width:none; padding:24px calc(50% - 35px);
  scroll-behavior:smooth;
  align-items:flex-start;
}
.carousel::-webkit-scrollbar { display:none; }
.ball-wrapper {
  flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;
  scroll-snap-align:center; cursor:pointer;
  transform:scale(1); opacity:0.6;
  transition:transform 0.35s ease, opacity 0.35s ease;
}
.ball-wrapper.active { transform:scale(1.14); opacity:1; }
.ball-item {
  width:70px; height:70px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  outline:3px solid rgba(255,255,255,0.95);
  outline-offset:2px;
  box-shadow:0 0 0 3px rgba(138,170,192,0.45),0 0 0 6px rgba(255,255,255,0.95),0 0 0 9px rgba(80,140,220,0.45);
}
.ball-item img { width:70px; height:70px; object-fit:cover; border-radius:50%; display:block; }
.ball-label {
  font-size:0.68rem; color:#5a7aa0;
  font-family:'Noto Sans SC',sans-serif;
  white-space:nowrap;
}
.ball-health { background:linear-gradient(135deg,rgba(80,180,120,0.85),rgba(40,130,80,0.85)); }
.ball-wealth { background:linear-gradient(135deg,rgba(212,160,40,0.85),rgba(160,110,10,0.85)); }
.ball-sp     { background:linear-gradient(135deg,rgba(220,100,140,0.85),rgba(170,50,90,0.85)); }
.ball-social { background:linear-gradient(135deg,rgba(80,160,220,0.85),rgba(40,110,180,0.85)); }

/* 目标卡片 */
.goal-item {
  background:rgba(255,255,255,0.85);
  border:1px solid rgba(180,210,240,0.4);
  border-radius:16px; padding:14px 16px;
  margin-bottom:10px;
  transition:box-shadow 0.2s;
}
.goal-badge {
  display:inline-flex; align-items:center; gap:3px;
  background:rgba(74,159,212,0.15); border-radius:10px;
  padding:2px 8px; font-size:0.68rem; color:#2a6090;
  font-family:'Noto Sans SC',sans-serif; margin-bottom:3px;
}
.goal-text {
  font-size:0.92rem; color:#0e2840; line-height:1.6; margin-bottom:3px;
}
.goal-footer {
  display:flex; align-items:flex-end; justify-content:space-between;
}

/* 头像球 */
.avatar-row { display:flex; align-items:flex-end; }
.avatar-bubble {
  width:18px; height:18px; border-radius:50%; flex-shrink:0;
  margin-right:-3px; display:flex; align-items:center; justify-content:center;
  font-size:0.55rem; font-weight:400; font-family:'Noto Serif SC',serif;
  color:#8aaac0; overflow:hidden;
  border:0.5px solid rgba(255,255,255,0.5);
}
.avatar-joined {
  font-size:0.7rem; color:#8aaac0; margin-left:8px;
  font-family:'Noto Serif SC',serif; letter-spacing:0.05em;
}

/* 加入按钮 */
.btn-join {
  padding:8px 18px; border:none; border-radius:12px;
  background:rgba(60,130,220,0.85); color:#fff;
  font-size:0.82rem; cursor:pointer;
  font-family:'Noto Serif SC',serif;
  white-space:nowrap; flex-shrink:0;
  transition:opacity 0.18s;
}
.btn-join:hover { opacity:0.88; }
.btn-join.joined {
  background:rgba(100,160,220,0.2);
  color:#5a7aa0; cursor:default;
}

<script>
(function() {
var canvas = document.createElement('canvas');
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;
const COLORS = [{r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},{r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},{r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224}];
class Bubble {
  constructor(f) { this.reset(f); }
  reset(s) {
    this.x=Math.random()*W; this.y=s?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2);
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30); this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
  }
  update(t) {
    this.life++; this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp; this.y+=this.vy;
    const p=this.life/this.maxLife;
    if(p<0.08) this.opacity=(p/0.08)*0.25; else if(p>0.85) this.opacity*=0.97;
    if(this.y<-this.r*3||this.life>this.maxLife) this.reset(true);
  }
  draw() {
    const x=this.x,y=this.y,r=this.r,a=this.opacity,{r:cr,g:cg,b:cb}=this.color;
    const glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,`rgba(${cr},${cg},${cb},${a*0.65})`); glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    const shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0,`rgba(255,255,255,${a*0.70})`); shell.addColorStop(0.12,`rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55,`rgba(${cr},${cg},${cb},${a*0.48})`); shell.addColorStop(1,`rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    const sp=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0,`rgba(255,255,255,${Math.min(1,a*1.6)})`);sp.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
  }
}
const BUBBLES=Array.from({length:55},(_,i)=>new Bubble(i>20));
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function draw(){
  requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  BUBBLES.forEach(b=>{b.update(t);b.draw();});
}
window.addEventListener('resize',resize);resize();draw();
})();
</script>

const BUBBLE_COLORS = [
  'linear-gradient(135deg,rgba(60,130,220,0.85),rgba(40,110,200,0.85))',
  'linear-gradient(135deg,rgba(60,130,220,0.85),rgba(40,110,200,0.85))',
  'linear-gradient(135deg,rgba(60,130,220,0.85),rgba(40,110,200,0.85))',
  'linear-gradient(135deg,rgba(60,130,220,0.85),rgba(40,110,200,0.85))',
  'linear-gradient(135deg,rgba(60,130,220,0.85),rgba(40,110,200,0.85))',
  'linear-gradient(135deg,rgba(60,130,220,0.85),rgba(40,110,200,0.85))',
];

let joined = new Set();
let currentCat = '全部';

const ICONS = {'健康':'🌿','财富':'💰','SP':'💞','人际':'🤝','学业':'📚','事业':'💼','原生家庭':'🏠','个人价值':'💎','地球':'🌍'};

function setupCarousel() {
  const carousel = document.getElementById('plazaCarousel');
  const balls = carousel.querySelectorAll('.ball-wrapper');

  // 初始化：滚动到第4个球居中
  setTimeout(() => {
    const fourthBall = balls[3];
    const scrollTo = fourthBall.offsetLeft - carousel.clientWidth / 2 + fourthBall.offsetWidth / 2;
    carousel.scrollLeft = scrollTo;
    balls[3].classList.add('active');
    currentCat = balls[3].dataset.cat;
    const icon = ICONS[currentCat] || '✨';
    renderList();
  }, 50);

  carousel.addEventListener('scroll', () => {
    const center = carousel.scrollLeft + carousel.clientWidth / 2;
    let closest = null, minDist = Infinity;
    balls.forEach(ball => {
      const ballCenter = ball.offsetLeft + ball.offsetWidth / 2;
      const dist = Math.abs(center - ballCenter);
      if (dist < minDist) { minDist = dist; closest = ball; }
    });
    balls.forEach(b => b.classList.remove('active'));
    if (closest) {
      closest.classList.add('active');
      currentCat = closest.dataset.cat;
      const icon = ICONS[currentCat] || '✨';
      renderList();
    }
  });

  balls.forEach(ball => {
    ball.addEventListener('click', () => {
      ball.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    });
  });
}
setupCarousel();

function renderList() {
  const filtered = currentCat === '全部' ? GOALS : GOALS.filter(g => g.cat === currentCat);
  const list = document.getElementById('plazaList');
  list.innerHTML = filtered.map(g => {
    const icon = CAT_ICONS[g.cat] || '✨';
    const isJoined = joined.has(g.id);
    const avatars = g.participants.slice(0, 6).map((p, i) =>
      `<div class="avatar-bubble" style="background:${BUBBLE_COLORS[i % BUBBLE_COLORS.length]};color:rgba(255,255,255,0.92);">${p}</div>`
    ).join('');
    return `<div class="goal-item">
      <span class="goal-badge">${icon} ${g.cat}</span>
      <p class="goal-text">${g.text}</p>
      <div class="goal-footer">
        <div class="avatar-row">
          ${avatars}
          <span class="avatar-joined">${g.count}人同频释放</span>
        </div>
        <button class="btn-join${isJoined?' joined':''}" onclick="joinGoal(${g.id}, this)">${isJoined?'已加入':'加入'}</button>
      </div>
    </div>`;
  }).join('');
}

function joinGoal(id, btn) {
  if (joined.has(id)) return;
  joined.add(id);
  btn.textContent = '已加入';
  btn.classList.add('joined');
  // 鼓励文案
  const goal = GOALS.find(g => g.id === id);
  if (goal) {
    goal.count++;
    const n = goal.count;
    showToast(`又多了一份力量！现在 ${n} 位伙伴同频释放，能量是 ${n*n} 倍 ✨`);
  }
}

function showToast(msg) {
  var el = document.getElementById('plazaToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'plazaToast';
    el.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(10,40,80,0.85);color:#fff;padding:10px 20px;border-radius:99px;font-size:0.82rem;z-index:9999;transition:opacity 0.4s;pointer-events:none;max-width:85vw;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = '0', 3000);
}

renderList();
</script>
