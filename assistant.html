<script>
(function() {
var canvas = document.createElement('canvas');
canvas.id = 'bgCanvas';
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;
const EMOTION_COLORS = [
  {r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},
  {r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},
  {r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224},
];
class Bubble {
  constructor(fromBottom) { this.reset(fromBottom); }
  reset(startAtBottom) {
    this.x=Math.random()*W; this.y=startAtBottom?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2); this.vx=0;
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30); this.color=EMOTION_COLORS[Math.floor(Math.random()*EMOTION_COLORS.length)];
  }
  update(t) {
    this.life++;
    this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp; this.y+=this.vy;
    const progress=this.life/this.maxLife;
    if(progress<0.08){this.opacity=(progress/0.08)*(0.25+Math.random()*0.01);}
    else if(progress>0.85){this.opacity*=0.97;}
    if(this.y<-this.r*3||this.life>this.maxLife){this.reset(true);}
  }
  draw() {
    const x=this.x,y=this.y,r=this.r,a=this.opacity,{r:cr,g:cg,b:cb}=this.color;
    const glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,`rgba(${cr},${cg},${cb},${a*0.65})`);
    glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    const shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0.00,`rgba(255,255,255,${a*0.70})`);
    shell.addColorStop(0.12,`rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55,`rgba(${cr},${cg},${cb},${a*0.48})`);
    shell.addColorStop(0.82,`rgba(${cr},${cg},${cb},${a*0.62})`);
    shell.addColorStop(1.00,`rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a*0.90})`;ctx.lineWidth=Math.max(0.5,r*0.06);ctx.stroke();
    const sp=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0,`rgba(255,255,255,${Math.min(1,a*1.6)})`);sp.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
    const sp2=ctx.createRadialGradient(x+r*0.38,y+r*0.30,0,x+r*0.38,y+r*0.30,r*0.14);
    sp2.addColorStop(0,`rgba(255,255,255,${a*0.38})`);sp2.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp2;ctx.fill();
  }
}
const BUBBLES=Array.from({length:55},(_,i)=>new Bubble(i>20));
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function draw(){
  requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');
  bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  BUBBLES.forEach(function(b){b.update(t);b.draw();});
}
window.addEventListener('resize',resize);resize();draw();
})();
</script>

<script>
const currentLang = 'zh';
const DESIRE_INFO = {
  control:{label:'想要控制',cls:'bc'},
  approval:{label:'想要被认同',cls:'ba'},
  safety:{label:'想要安全',cls:'bs'}
};
let asstPoints = [];

// ── 页面加载时更新 lock badge 显示状态 ──
document.addEventListener('DOMContentLoaded', async function() {
  if (window.FreedPaywall) {
    const isPremium = await FreedPaywall.checkPremium();
    if (isPremium) {
      document.querySelectorAll('.lock-badge').forEach(el => el.style.display = 'none');
    }
  }
});

// ── 卡点释放 ──
function openBlockPoint() {
  requirePremium(function() {
    document.getElementById('card-blockpoint').style.display = 'none';
    document.getElementById('panel-blockpoint').style.display = 'flex';
  });
}
function closeBlockPoint() {
  document.getElementById('panel-blockpoint').style.display = 'none';
  document.getElementById('card-blockpoint').style.display = 'flex';
  document.getElementById('asstResult').classList.remove('show');
  document.getElementById('asstInput').value = '';
}

// ── 限制性信念释放（内容待开发）──
function openLimitingBeliefs() {
  requirePremium(function() {
    showToast('🚧 即将上线，敬请期待');
  });
}

// ── 自我允许释放（内容待开发）──
function openSelfAllowance() {
  requirePremium(function() {
    showToast('🚧 即将上线，敬请期待');
  });
}

// ── 工具函数 ──
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  var el = document.getElementById('asstToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'asstToast';
    el.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(10,40,80,0.85);color:#fff;padding:10px 20px;border-radius:99px;font-size:0.85rem;z-index:9999;transition:opacity 0.4s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.opacity = '0'; }, 2500);
}
function startReleaseQueue() {
  if (!asstPoints.length) { showToast('没有可释放的结果'); return; }
  sessionStorage.setItem('asstReleaseQueue', JSON.stringify(asstPoints));
  window.location.href = 'desire.html';
}

// ── AI 分析（卡点释放）──
function getLangSystemPrompt() {
  return '你是一位深度心理洞察师，精通圣多纳释放法（Sedona Method）。\n\n'
    + '三种核心欲望：\n'
    + '- control（想要控制）：渴望掌控局面、结果、他人；害怕失控、混乱、不确定\n'
    + '- approval（想要被认同）：渴望被接受、肯定、爱；害怕被拒绝、批评、抛弃\n'
    + '- safety（想要安全）：渴望稳定、保障、确定；害怕失去、改变、受伤\n\n'
    + '你的核心任务：尽可能多地挖掘用户察觉不到的深层欲望。\n\n'
    + '分析层次（每一层都要找）：\n'
    + '1. **表层欲望**：用户字面说出来的渴望或恐惧\n'
    + '2. **次层欲望**：表层渴望背后的更深需求（例如想要高薪→想要安全）\n'
    + '3. **隐藏欲望**：用户回避、不愿承认、甚至自己都不知道的欲望（这是最重要的）\n'
    + '4. **矛盾欲望**：同一段文字里互相冲突的欲望（例如又想要又怕被看到）\n'
    + '5. **行为背后的欲望**：每个具体行为/抗拒/拖延背后的欲望\n\n'
    + '输出原则：\n'
    + '- 至少给出 5-8 个洞察点（短输入 5 个，复杂输入 8-12 个）\n'
    + '- 每条 quote 用用户原文里的关键词，或 AI 提炼的短句（不超过 20 字）\n'
    + '- 每条 reason 控制在 50-80 字，把洞察讲透\n'
    + '- 同一种欲望可以多次出现\n\n'
    + '严格用以下JSON格式回复，不要任何其他内容：\n'
    + '{"points":[{"quote":"短句不超过20字","desire":"control或approval或safety","reason":"深度洞察50-80字"}]}';
}

async function runAssistant() {
  const text = document.getElementById('asstInput').value.trim();
  if (!text) { showToast('请先写下你的感受'); return; }
  const loadingEl = document.getElementById('asstLoading');
  const resultEl  = document.getElementById('asstResult');
  loadingEl.style.display = 'flex';
  resultEl.classList.remove('show');
  try {
    let res = null, lastErr = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        res = await fetch('https://api.freedreleasing.com/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            model: 'deepseek-chat',
            max_tokens: 4000,
            messages: [
              { role: 'system', content: getLangSystemPrompt() },
              { role: 'user',   content: text },
            ],
          }),
        });
        clearTimeout(timeoutId);
        if (res.ok) break;
        lastErr = new Error('HTTP ' + res.status);
      } catch(err) { lastErr = err; }
      if (attempt < 2) await new Promise(r => setTimeout(r, (attempt + 1) * 1000));
    }
    if (!res || !res.ok) throw lastErr || new Error('网络请求失败，请稍后再试');
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.choices?.[0]?.message?.content || '';
    if (!raw) throw new Error('empty response');
    let json = { points: [] };
    try {
      const start = raw.indexOf('{');
      const end = raw.lastIndexOf('}');
      json = JSON.parse(raw.slice(start, end + 1));
    } catch(_) {}
    let rawPoints = json.points || json.results || json.analysis || json.data || [];
    if (!Array.isArray(rawPoints)) rawPoints = [];
    asstPoints = rawPoints.map(p => {
      let desire = String(p.desire || p.type || p.category || '').toLowerCase();
      if (desire.includes('control') || desire.includes('控制')) desire = 'control';
      else if (desire.includes('approval') || desire.includes('认同') || desire.includes('被爱')) desire = 'approval';
      else if (desire.includes('safety') || desire.includes('安全')) desire = 'safety';
      return { desire, quote: p.quote || p.text || p.phrase || '', reason: p.reason || p.explanation || p.analysis || '' };
    }).filter(p => DESIRE_INFO[p.desire]);
    if (!asstPoints.length) throw new Error('AI 返回格式异常，请重试。');
    resultEl.innerHTML = '<div class="asst-desire-badges" id="asstBadges"></div>'
      + '<div class="asst-analysis" id="asstAnalysis"></div>'
      + '<button class="asst-go-btn" onclick="startReleaseQueue()">🫧 去释放这些想要</button>';
    const seenBadge = new Set();
    document.getElementById('asstBadges').innerHTML = asstPoints
      .filter(p => !seenBadge.has(p.desire) && seenBadge.add(p.desire))
      .map(p => `<span class="asst-badge ${DESIRE_INFO[p.desire].cls}">${DESIRE_INFO[p.desire].label}</span>`)
      .join('');
    document.getElementById('asstAnalysis').innerHTML = asstPoints.map(p => `
      <div class="asst-point">
        <span class="asst-point-badge ${DESIRE_INFO[p.desire].cls}">${DESIRE_INFO[p.desire].label}</span>
        <div class="asst-point-body">
          <span class="asst-point-quote">「${escapeHtml(p.quote)}」</span>
          <span class="asst-point-reason">${escapeHtml(p.reason)}</span>
        </div>
      </div>`).join('');
    resultEl.classList.add('show');
  } catch(e) {
    const msg = (e && e.message) ? e.message : String(e);
    showToast('❌ ' + msg.slice(0, 80));
    resultEl.innerHTML = '<div style="padding:12px;color:#c04040;font-size:0.78rem;line-height:1.6;font-family:monospace;word-break:break-all;">错误：' + msg + '</div>';
    resultEl.classList.add('show');
    console.error('Assistant error:', e);
  } finally {
    loadingEl.style.display = 'none';
  }
}
</script>
<script src="nav-orb.js"></script>
</body>
</html>
