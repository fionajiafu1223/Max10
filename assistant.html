<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>释放助手 · Freed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height:100vh; background:transparent; font-family:'Noto Serif SC',serif; overflow:hidden; }

.page-title {
  position: fixed; top: max(28px, calc(env(safe-area-inset-top,0px) + 14px));
  left: 50%; transform: translateX(-50%);
  font-size: 1.1rem; letter-spacing: 0.2em; color: rgba(3,80,140,0.85);
  z-index: 20; white-space: nowrap; pointer-events: none;
}

/* ── 浮动球容器 ── */
#asst-layer {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
}

/* ── 单个球 ── */
.asst-orb {
  position: absolute;
  border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  cursor: pointer;
  pointer-events: auto;
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  color: rgba(220,245,255,0.95);
  text-shadow: 0 1px 6px rgba(0,60,120,0.4);
  line-height: 1.4;
  letter-spacing: 0.06em;
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  opacity: 0;
  user-select: none;
  backdrop-filter: blur(3px);
  animation-fill-mode: both;
}
.asst-orb.visible {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  animation: orbBob var(--bob-dur, 3.5s) ease-in-out infinite;
  animation-delay: var(--bob-delay, 0s);
}
.asst-orb:active { transform: translate(-50%,-50%) scale(0.92); }

@keyframes orbBob {
  0%,100% { margin-top: 0px; }
  50%      { margin-top: -10px; }
}

.asst-orb-emoji {
  font-size: 1.6rem; margin-bottom: 4px;
  filter: drop-shadow(0 1px 4px rgba(0,60,120,0.3));
}
.asst-orb-name {
  font-size: 0.72rem; letter-spacing: 0.08em;
  line-height: 1.4;
}

/* ── 卡点释放展开面板（覆盖在球上方）── */
#panel-blockpoint {
  position: fixed; inset: 0; z-index: 30;
  display: none; flex-direction: column;
  background: transparent;
  padding: 80px 16px 32px;
  overflow-y: auto;
}
#panel-blockpoint.open { display: flex; }
.panel-inner {
  max-width: 480px; margin: 0 auto; width: 100%;
  background: rgba(255,255,255,0.88);
  border-radius: 20px; padding: 20px 16px;
  box-shadow: 0 8px 32px rgba(0,60,120,0.10);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.85);
  display: flex; flex-direction: column; gap: 12px;
}
.panel-back {
  max-width: 480px; margin: 0 auto 12px; width: 100%;
  display: flex; align-items: center; gap: 6px;
  color: rgba(3,80,140,0.7); font-size: 0.82rem;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer; letter-spacing: 0.04em;
}
.panel-back:hover { color: rgba(3,80,140,1); }
.panel-title {
  font-size: 1rem; letter-spacing: 0.1em; color: #0e2840; margin-bottom: 2px;
}
.asst-subtitle {
  font-size: 0.78rem; color: #5a7aa0;
  font-family: 'Noto Sans SC', sans-serif;
  letter-spacing: 0.04em; line-height: 1.6;
}
.asst-textarea {
  width: 100%; min-height: 100px; padding: 12px 14px;
  border: 1.5px solid rgba(140,180,225,0.5); border-radius: 14px;
  background: rgba(255,255,255,0.7); color: #0e2840;
  font-family: 'Noto Serif SC', serif; font-size: 0.92rem;
  line-height: 1.7; outline: none; resize: vertical;
}
.asst-textarea:focus { border-color: rgba(80,140,220,0.75); }
.asst-submit {
  padding: 12px; border: none; border-radius: 14px;
  background: linear-gradient(160deg, rgba(80,140,220,0.85) 0%, rgba(60,180,150,0.75) 100%);
  color: #fff; font-family: 'Noto Serif SC', serif; font-size: 0.92rem;
  cursor: pointer; transition: transform 0.18s;
}
.asst-submit:hover { opacity: 0.88; transform: scale(1.04); }
.asst-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.asst-result { display: none; flex-direction: column; gap: 14px; margin-top: 8px; }
.asst-result.show { display: flex; }
.asst-desire-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.asst-badge { padding: 6px 14px; border-radius: 99px; font-size: 0.85rem; font-family: 'Noto Serif SC', serif; }
.asst-badge.bc { background: rgba(255,192,210,0.55); color: #7a1030; border: 1.5px solid rgba(192,51,82,0.3); }
.asst-badge.ba { background: rgba(153,251,200,0.45); color: #0a4a28; border: 1.5px solid rgba(24,134,73,0.3); }
.asst-badge.bs { background: rgba(161,202,255,0.45); color: #0a2860; border: 1.5px solid rgba(43,74,219,0.3); }
.asst-analysis { display: flex; flex-direction: column; gap: 10px; }
.asst-point {
  background: rgba(255,255,255,0.75); border-radius: 14px; padding: 12px 14px;
  border: 1px solid rgba(180,210,240,0.4); display: flex; flex-direction: column; gap: 6px;
}
.asst-point-badge { align-self: flex-start; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-family: 'Noto Serif SC', serif; }
.asst-point-body { display: flex; flex-direction: column; gap: 6px; }
.asst-point-quote { font-size: 0.92rem; color: #0e2840; font-style: italic; padding: 6px 0; }
.asst-point-reason { font-size: 0.82rem; color: #5a7aa0; line-height: 1.7; font-family: 'Noto Sans SC', sans-serif; }
.asst-loading { display: none; align-items: center; justify-content: center; gap: 8px; padding: 24px; color: #5a7aa0; }
.asst-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(80,140,220,0.7); animation: dotPulse 1.4s ease infinite; }
.asst-dot:nth-child(2) { animation-delay: 0.2s; }
.asst-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse { 0%,60%,100%{opacity:0.3;transform:scale(0.8)} 30%{opacity:1;transform:scale(1.2)} }
.asst-go-btn {
  width: 100%; padding: 12px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, #4a9fd4, #2a7abf); color: #fff;
  font-family: 'Noto Serif SC', serif; font-size: 0.92rem; letter-spacing: 0.08em;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s; margin-top: 4px;
}
.asst-go-btn:hover { opacity: 0.88; transform: scale(1.02); }
</style>

<!-- 背景气泡 -->
<script>
(function() {
var canvas = document.createElement('canvas');
canvas.id = 'bgCanvas';
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;
const EMOTION_COLORS = [
  {r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},
  {r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},
  {r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224},
];
class Bubble {
  constructor(fromBottom) { this.reset(fromBottom); }
  reset(s) {
    this.x=Math.random()*W; this.y=s?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2);
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30); this.color=EMOTION_COLORS[Math.floor(Math.random()*EMOTION_COLORS.length)];
  }
  update(t) {
    this.life++;
    this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp; this.y+=this.vy;
    const p=this.life/this.maxLife;
    if(p<0.08) this.opacity=(p/0.08)*(0.25+Math.random()*0.01);
    else if(p>0.85) this.opacity*=0.97;
    if(this.y<-this.r*3||this.life>this.maxLife) this.reset(true);
  }
  draw() {
    const x=this.x,y=this.y,r=this.r,a=this.opacity,{r:cr,g:cg,b:cb}=this.color;
    const glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,`rgba(${cr},${cg},${cb},${a*0.65})`); glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    const shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0.00,`rgba(255,255,255,${a*0.70})`); shell.addColorStop(0.12,`rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55,`rgba(${cr},${cg},${cb},${a*0.48})`); shell.addColorStop(0.82,`rgba(${cr},${cg},${cb},${a*0.62})`);
    shell.addColorStop(1.00,`rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a*0.90})`;ctx.lineWidth=Math.max(0.5,r*0.06);ctx.stroke();
    const sp=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0,`rgba(255,255,255,${Math.min(1,a*1.6)})`);sp.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
  }
}
const BUBBLES=Array.from({length:55},(_,i)=>new Bubble(i>20));
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function draw(){
  requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');
  bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  BUBBLES.forEach(b=>{b.update(t);b.draw();});
}
window.addEventListener('resize',resize);resize();draw();
})();
</script>

<div class="page-title">🫧 释 放 助 手</div>

<!-- 三个浮动球 -->
<div id="asst-layer">
  <div class="asst-orb" id="orb-blockpoint"

<script src="paywall.js"></script>
<script>
const DESIRE_INFO = {
  control:{label:'想要控制',cls:'bc'},
  approval:{label:'想要被认同',cls:'ba'},
  safety:{label:'想要安全',cls:'bs'}
};
let asstPoints = [];

// ── 球颜色 ──
const ORB_COLORS = {
  'orb-blockpoint': 'rgba(74,160,230,0.50)',
  'orb-beliefs':    'rgba(220,130,170,0.45)',
  'orb-allowance':  'rgba(60,180,120,0.50)',
};
function setOrbColors() {
  document.querySelectorAll('.asst-orb').forEach(orb => {
    const glow = ORB_COLORS[orb.id] || 'rgba(74,160,230,0.50)';
    orb.style.background = [
      'radial-gradient(circle at 32% 28%,',
      '  rgba(255,255,255,0.75) 0%,',
      '  rgba(220,225,230,0.45) 22%,',
      '  ' + glow.replace('0.50','0.30').replace('0.45','0.25') + ' 50%,',
      '  ' + glow.replace('0.50','0.22').replace('0.45','0.18') + ' 75%,',
      '  ' + glow.replace('0.50','0.10').replace('0.45','0.08') + ' 100%)',
    ].join('');
    orb.style.boxShadow = [
      'inset 0 0 35px ' + glow.replace('0.50','0.75').replace('0.45','0.70'),
      'inset 0 0 14px ' + glow.replace('0.50','0.65').replace('0.45','0.60'),
      '0 4px 22px '     + glow.replace('0.50','0.80').replace('0.45','0.75'),
      '0 0 32px '       + glow.replace('0.50','0.45').replace('0.45','0.40'),
    ].join(', ');
  });
}

// ── 球出现动画 ──
window.addEventListener('DOMContentLoaded', function() {
  setOrbColors();
  document.querySelectorAll('.asst-orb').forEach((orb, i) => {
    setTimeout(() => orb.classList.add('visible'), 100 + i * 100);
  });
});

// ── 功能入口 ──
function openBlockPoint() {
  requirePremium(function() {
    document.getElementById('asst-layer').style.display = 'none';
    document.getElementById('panel-blockpoint').classList.add('open');
  });
}
function closeBlockPoint() {
  document.getElementById('panel-blockpoint').classList.remove('open');
  document.getElementById('asst-layer').style.display = 'block';
  document.getElementById('asstResult').classList.remove('show');
  document.getElementById('asstInput').value = '';
}
function openBeliefs() {
  requirePremium(function() {
    showToast('🚧 即将上线，敬请期待');
  });
}
function openAllowance() {
  requirePremium(function() {
    showToast('🚧 即将上线，敬请期待');
  });
}

// ── Toast ──
function showToast(msg) {
  var el = document.getElementById('asstToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'asstToast';
    el.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(10,40,80,0.85);color:#fff;padding:10px 20px;border-radius:99px;font-size:0.85rem;z-index:9999;transition:opacity 0.4s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.opacity = '0'; }, 2500);
}

function startReleaseQueue() {
  if (!asstPoints.length) { showToast('没有可释放的结果'); return; }
  sessionStorage.setItem('asstReleaseQueue', JSON.stringify(asstPoints));
  window.location.href = 'desire.html';
}

// ── 深度分析（卡点释放）──
function getSystemPrompt() {
  return '你是一位深度心理洞察师，精通圣多纳释放法（Sedona Method）。\n\n'
    + '三种核心欲望：\n'
    + '- control（想要控制）：渴望掌控局面、结果、他人；害怕失控、混乱、不确定\n'
    + '- approval（想要被认同）：渴望被接受、肯定、爱；害怕被拒绝、批评、抛弃\n'
    + '- safety（想要安全）：渴望稳定、保障、确定；害怕失去、改变、受伤\n\n'
    + '你的核心任务：尽可能多地挖掘用户察觉不到的深层欲望。\n\n'
    + '分析层次（每一层都要找）：\n'
    + '1. 表层欲望：用户字面说出来的渴望或恐惧\n'
    + '2. 次层欲望：表层渴望背后的更深需求\n'
    + '3. 隐藏欲望：用户回避、不愿承认、甚至自己都不知道的欲望\n'
    + '4. 矛盾欲望：同一段文字里互相冲突的欲望\n'
    + '5. 行为背后的欲望：每个具体行为/抗拒/拖延背后的欲望\n\n'
    + '输出原则：\n'
    + '- 至少给出 5-8 个洞察点\n'
    + '- 每条 quote 用用户原文里的关键词，或 AI 提炼的短句（不超过 20 字）\n'
    + '- 每条 reason 控制在 50-80 字\n'
    + '- 同一种欲望可以多次出现\n\n'
    + '严格用以下JSON格式回复，不要任何其他内容：\n'
    + '{"points":[{"quote":"短句不超过20字","desire":"control或approval或safety","reason":"深度洞察50-80字"}]}';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function runAssistant() {
  const text = document.getElementById('asstInput').value.trim();
  if (!text) { showToast('请先写下你的感受'); return; }
  const loadingEl = document.getElementById('asstLoading');
  const resultEl  = document.getElementById('asstResult');
  loadingEl.style.display = 'flex';
  resultEl.classList.remove('show');
  try {
    let res = null, lastErr = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);
        res = await fetch('https://api.freedreleasing.com/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            model: 'deepseek-chat', max_tokens: 4000,
            messages: [
              { role: 'system', content: getSystemPrompt() },
              { role: 'user',   content: text },
            ],
          }),
        });
        clearTimeout(timeoutId);
        if (res.ok) break;
        lastErr = new Error('HTTP ' + res.status);
      } catch(err) { lastErr = err; }
      if (attempt < 2) await new Promise(r => setTimeout(r, (attempt+1)*1000));
    }
    if (!res || !res.ok) throw lastErr || new Error('网络请求失败，请稍后再试');
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.choices?.[0]?.message?.content || '';
    if (!raw) throw new Error('empty response');
    let json = { points: [] };
    try { const s=raw.indexOf('{'),e=raw.lastIndexOf('}'); json=JSON.parse(raw.slice(s,e+1)); } catch(_){}
    let rawPoints = json.points||json.results||json.analysis||json.data||[];
    if (!Array.isArray(rawPoints)) rawPoints = [];
    asstPoints = rawPoints.map(p => {
      let desire = String(p.desire||p.type||p.category||'').toLowerCase();
      if (desire.includes('control')||desire.includes('控制')) desire='control';
      else if (desire.includes('approval')||desire.includes('认同')||desire.includes('被爱')) desire='approval';
      else if (desire.includes('safety')||desire.includes('安全')) desire='safety';
      return { desire, quote:p.quote||p.text||p.phrase||'', reason:p.reason||p.explanation||p.analysis||'' };
    }).filter(p => DESIRE_INFO[p.desire]);
    if (!asstPoints.length) throw new Error('返回格式异常，请重试。');
    resultEl.innerHTML = '<div class="asst-desire-badges" id="asstBadges"></div>'
      + '<div class="asst-analysis" id="asstAnalysis"></div>'
      + '<button class="asst-go-btn" onclick="startReleaseQueue()">🫧 去释放这些想要</button>';
    const seenBadge = new Set();
    document.getElementById('asstBadges').innerHTML = asstPoints
      .filter(p => !seenBadge.has(p.desire) && seenBadge.add(p.desire))
      .map(p => `<span class="asst-badge ${DESIRE_INFO[p.desire].cls}">${DESIRE_INFO[p.desire].label}</span>`).join('');
    document.getElementById('asstAnalysis').innerHTML = asstPoints.map(p => `
      <div class="asst-point">
        <span class="asst-point-badge ${DESIRE_INFO[p.desire].cls}">${DESIRE_INFO[p.desire].label}</span>
        <div class="asst-point-body">
          <span class="asst-point-quote">「${escapeHtml(p.quote)}」</span>
          <span class="asst-point-reason">${escapeHtml(p.reason)}</span>
        </div>
      </div>`).join('');
    resultEl.classList.add('show');
  } catch(e) {
    const msg = (e&&e.message)?e.message:String(e);
    showToast('❌ ' + msg.slice(0,80));
    resultEl.innerHTML = `<div style="padding:12px;color:#c04040;font-size:0.78rem;line-height:1.6;font-family:monospace;word-break:break-all;">错误：${msg}</div>`;
    resultEl.classList.add('show');
    console.error('Assistant error:', e);
  } finally {
    loadingEl.style.display = 'none';
  }
}
</script>
<script src="nav-orb.js"></script>
</body>
</html>
