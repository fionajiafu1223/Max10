<script>
(function() {
var canvas = document.createElement('canvas');
canvas.id = 'bgCanvas';
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;

const EMOTION_COLORS = [
  {r:144, g:96,  b:208}, // 恐惧 紫
  {r:48,  g:80,  b:176}, // 悲苦 深蓝
  {r:80,  g:110, b:160}, // 万念俱灰 蓝灰
  {r:192, g:96,  b:16 }, // 贪求 橙
  {r:192, g:32,  b:32 }, // 愤怒 红
  {r:176, g:128, b:0  }, // 自尊自傲 金
  {r:16,  g:160, b:144}, // 无畏 青绿
  {r:16,  g:160, b:80 }, // 接纳 绿
  {r:74,  g:176, b:224}, // 平和 天蓝
];


class Bubble {
  constructor(fromBottom) {
    this.reset(fromBottom);
  }

  reset(startAtBottom) {
    this.x    = Math.random() * W;
    this.y    = startAtBottom ? H + 20 + Math.random()*100 : Math.random() * H;
    this.r    = 2 + Math.random() * 22;
    this.vy   = -(0.4 + Math.random() * 1.2);
    this.vx   = 0;
    this.wobbleAmp   = 0.4 + Math.random() * 1.2;
    this.wobbleFreq  = 0.8 + Math.random() * 1.5;
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.opacity = 0.20 + Math.random() * 0.20;
    this.life    = 0;
    this.maxLife = (H + 200) / Math.abs(this.vy) * (0.7 + Math.random()*0.5);
    this.vy *= (0.8 + this.r / 30);
    this.color = EMOTION_COLORS[Math.floor(Math.random() * EMOTION_COLORS.length)];
  }

  update(t) {
    this.life++;
    // wobbly horizontal drift — classic bubble sway
    this.x += Math.sin(t * this.wobbleFreq + this.wobblePhase) * this.wobbleAmp;
    this.y += this.vy;

    // fade in at bottom, fade out at top
    const progress = this.life / this.maxLife;
    if (progress < 0.08) {
      this.opacity = (progress / 0.08) * (0.25 + Math.random()*0.01);
    } else if (progress > 0.85) {
      this.opacity *= 0.97;
    }

    if (this.y < -this.r * 3 || this.life > this.maxLife) {
      this.reset(true);
    }
  }

  draw() {
    const x = this.x, y = this.y, r = this.r;
    const a = this.opacity;

    const {r:cr, g:cg, b:cb} = this.color;

    // outer soft glow — emotion color
    const glow = ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0, `rgba(${cr},${cg},${cb},${a*0.65})`);
    glow.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath(); ctx.arc(x,y,r*2.2,0,Math.PI*2);
    ctx.fillStyle=glow; ctx.fill();

    // glass shell — tinted with emotion color
    const shell = ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01, x,y,r);
    shell.addColorStop(0.00, `rgba(255,255,255,${a*0.70})`);
    shell.addColorStop(0.12, `rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55, `rgba(${cr},${cg},${cb},${a*0.48})`);
    shell.addColorStop(0.82, `rgba(${cr},${cg},${cb},${a*0.62})`);
    shell.addColorStop(1.00, `rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=shell; ctx.fill();

    // rim ring — emotion color tint
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a*0.90})`;
    ctx.lineWidth = Math.max(0.5, r*0.06);
    ctx.stroke();

    // primary specular — brighter for dark areas
    const sp = ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0, `rgba(255,255,255,${Math.min(1, a*1.6)})`);
    sp.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=sp; ctx.fill();

    // tiny secondary shimmer
    const sp2 = ctx.createRadialGradient(x+r*0.38,y+r*0.30,0,x+r*0.38,y+r*0.30,r*0.14);
    sp2.addColorStop(0, `rgba(255,255,255,${a*0.38})`);
    sp2.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=sp2; ctx.fill();
  }
}

const BUBBLES = Array.from({length: 55}, (_, i) => new Bubble(i > 20));

// hero bubble — large, center, also rising slowly

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function draw() {
  requestAnimationFrame(draw);
  t += 0.01;
  ctx.clearRect(0, 0, W, H);
  
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#cdeeff');
  bg.addColorStop(0.4, '#a8d8f0');
  bg.addColorStop(0.7, '#7abde0');
  bg.addColorStop(1, '#4a8fbf');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  BUBBLES.forEach(function(b) { b.update(t); b.draw(); });
}

window.addEventListener('resize', resize);
resize();
draw();
})();
</script>

<script>
const CAT_ICONS = {'健康':'🌿','财富':'💰','SP':'💞','人际关系':'🤝','学业':'📚','工作':'💼','其他':'✨'};
const SUPA_URL  = 'https://ryoaxziysgdkjcjiuqti.supabase.co';
const SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5b2F4eml5c2dka2pjaml1cXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDg2MDAsImV4cCI6MjA4OTA4NDYwMH0.ORG_8Ue8LjYfReMvKo1iQOFNGN7fcTz1_fMs8Gq1Kds';
let goalSelectedCat = '健康';

// ════════════════════════════════════════
// 登录态读取（同步、立即可用）
// ════════════════════════════════════════
function readGoalsUserFromStorage() {
  try {
    var raw = localStorage.getItem('sb-ryoaxziysgdkjcjiuqti-auth-token');
    if (!raw) return null;
    var obj = JSON.parse(raw);
    var token = obj && obj.access_token;
    if (!token) return null;
    var parts = token.split('.');
    if (parts.length !== 3) return null;
    var payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
    if (!payload || !payload.sub) return null;
    if (payload.exp && payload.exp * 1000 < Date.now()) return null;
    return { id: payload.sub, email: payload.email || '', token: token };
  } catch(_) { return null; }
}

// ════════════════════════════════════════
// 本地存储（缓存 + 未登录兜底）
// ════════════════════════════════════════
function getGoals() {
  try { return JSON.parse(localStorage.getItem('freed-goals') || '[]'); } catch(e) { return []; }
}
function saveGoals(g) {
  try { localStorage.setItem('freed-goals', JSON.stringify(g)); } catch(e) {}
}

// ════════════════════════════════════════
// 通用工具
// ════════════════════════════════════════
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  var el = document.getElementById('goalsToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'goalsToast';
    el.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(10,40,80,0.85);color:#fff;padding:10px 20px;border-radius:99px;font-size:0.85rem;z-index:9999;transition:opacity 0.4s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.opacity = '0'; }, 2500);
}
function selectGoalCat(btn) {
  goalSelectedCat = btn.dataset.cat;
  document.querySelectorAll('#goalCats .gain-cat').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

// ════════════════════════════════════════
// Supabase 请求
// path 例如 '/rest/v1/user_goals'
// useAuth=true 用 user token（写带 user_id 的数据时必须）
// ════════════════════════════════════════
async function supaFetch(path, opts) {
  opts = opts || {};
  var token = SUPA_KEY;
  if (opts.useAuth) {
    var u = readGoalsUserFromStorage();
    if (u && u.token) token = u.token;
    delete opts.useAuth;
  }
  var res = await freedFetch(SUPA_URL + path, Object.assign({}, opts, {
    headers: Object.assign({
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    }, opts.headers || {})
  }));
  if (!res.ok) return null;
  var ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

// ════════════════════════════════════════
// 云端：拉取登录用户的所有目标
// ════════════════════════════════════════
async function loadGoalsFromCloud() {
  var u = readGoalsUserFromStorage();
  if (!u) return null;
  // 读取也必须用 user token，因为 RLS 策略只允许读自己的（auth.uid() = user_id）
  var rows = await supaFetch('/rest/v1/user_goals?user_id=eq.' + u.id + '&select=*&order=ts.desc', {
    useAuth: true
  });
  if (!rows) return null;
  // 转成本地格式
  return rows.map(function(r) {
    return { id: r.id, text: r.text, cat: r.cat || '其他', ts: r.ts,
             reminder_time: r.reminder_time || null, target_days: r.target_days || null, plan_start: r.plan_start || null };
  });
}

// ════════════════════════════════════════
// 云端：添加目标
// ════════════════════════════════════════
async function addGoalToCloud(text, cat) {
  var u = readGoalsUserFromStorage();
  if (!u) return null;
  var ts = Date.now();
  var rows = await supaFetch('/rest/v1/user_goals', {
    method: 'POST',
    body: JSON.stringify({ user_id: u.id, text: text, cat: cat, ts: ts }),
    useAuth: true
  });
  if (rows && rows.length > 0) {
    var r = rows[0];
    return { id: r.id, text: r.text, cat: r.cat || '其他', ts: r.ts };
  }
  return { text: text, cat: cat, ts: ts };  // 即使失败也返回数据，本地能显示
}

// ════════════════════════════════════════
// 云端：删除目标（按云端 id）
// ════════════════════════════════════════
async function deleteGoalFromCloud(cloudId) {
  if (!cloudId) return false;
  await supaFetch('/rest/v1/user_goals?id=eq.' + encodeURIComponent(cloudId), {
    method: 'DELETE',
    useAuth: true
  });
  return true;
}

// ════════════════════════════════════════
// 渲染列表
// ════════════════════════════════════════
function renderGoals() {
  var goals = getGoals();
  var list = document.getElementById('goalsList');
  if (!goals.length) {
    list.innerHTML = '<li style="color:#8aa8c0;font-size:0.88rem;padding:12px 4px;font-family:Noto Sans SC,sans-serif;">还没有目标，添加一个吧 🌱</li>';
    return;
  }
  list.innerHTML = goals.map(function(g, i) {
    var icon = CAT_ICONS[g.cat] || '✨';
    var meta = goalMetaText(g);
    return '<li class="goal-item" id="goal-item-' + i + '" onclick="openModal(' + i + ')">' +
      '<span class="gain-badge">' + icon + ' ' + escapeHtml(g.cat || '') + '</span>' +
      '<p class="goal-item-text">' + escapeHtml(g.text) + '</p>' +
      (meta ? '<div class="goal-meta">' + meta + '</div>' : '') +
      '<div class="goal-item-actions" onclick="event.stopPropagation()">' +
      '<button class="goal-btn-release" onclick="releaseGoal(' + i + ')">🫧 释放</button>' +
      '<button class="goal-btn-drop" onclick="dropGoal(' + i + ')">✨ 掉落</button>' +
      '<button class="goal-btn-del" onclick="deleteGoal(' + i + ')">✕</button>' +
      '</div></li>';
  }).join('');
}

// ════════════════════════════════════════
// 添加目标
// ════════════════════════════════════════
async function addGoal() {
  var input = document.getElementById('goalInput');
  var text = input.value.trim();
  if (!text) return;

  // 付费检查：超过3个目标需要会员
  var existingGoals = getGoals();
  if (existingGoals.length >= 3 && typeof FreedPaywall !== 'undefined') {
    var isPremium = await FreedPaywall.checkPremium();
    if (!isPremium) {
      input.value = text; // 保留用户输入
      FreedPaywall.showPaywall(function() {
        addGoal(); // 付费成功后自动提交
      });
      return;
    }
  }

  input.value = '';

  var u = readGoalsUserFromStorage();
  if (u) {
    // 登录：先写云端，再更新本地缓存
    var cloud = await addGoalToCloud(text, goalSelectedCat);
    var goals = getGoals();
    goals.unshift({
      id: cloud && cloud.id,
      text: text,
      cat: goalSelectedCat,
      ts: cloud && cloud.ts ? cloud.ts : Date.now()
    });
    saveGoals(goals);
  } else {
    // 未登录：本地存
    var goals2 = getGoals();
    goals2.unshift({ text: text, cat: goalSelectedCat, ts: Date.now() });
    saveGoals(goals2);
  }
  renderGoals();
  showToast('🎯 目标已添加');
}

// ════════════════════════════════════════
// 删除目标
// ════════════════════════════════════════
async function deleteGoal(i) {
  var goals = getGoals();
  var goal = goals[i];
  if (!goal) return;

  var u = readGoalsUserFromStorage();
  if (goal.id) cancelGoalReminder(goal.id);
  if (u && goal.id) {
    // 登录用户：删云端（打卡记录随目标一起删除）
    await deleteGoalFromCloud(goal.id);
  }
  // 不论登录与否，本地都删
  goals.splice(i, 1);
  saveGoals(goals);
  renderGoals();
}

// ════════════════════════════════════════
// 释放目标（跳到 desire.html，不动数据库——目标在 desire 完成后会被清掉）
// ════════════════════════════════════════
function releaseGoal(i) {
  var goals = getGoals();
  var goal = goals[i];
  if (!goal) return;
  sessionStorage.setItem('releaseGoalText', goal.text);
  // 把云端 id 也带过去，desire.html 完成释放后能删云端记录（未来 desire 改造时用）
  if (goal.id) sessionStorage.setItem('releaseGoalCloudId', goal.id);
  window.location.href = 'desire.html';
}

// ════════════════════════════════════════
// 掉落目标 → 写入收获本（gain_entries）+ 删除目标
// ════════════════════════════════════════
async function dropGoal(i) {
  var goals = getGoals();
  var goal = goals[i];
  if (!goal) return;

  var u = readGoalsUserFromStorage();
  var entry = { text: goal.text, cat: goal.cat || '其他', ts: Date.now(), likes: 0 };
  if (u) entry.user_id = u.id;

  // 本地"我的收获"也加一条（兼容老逻辑）
  var myItems = [];
  try { myItems = JSON.parse(localStorage.getItem('freed-my-gains') || '[]'); } catch(e) {}
  myItems.unshift({ text: goal.text, cat: goal.cat || '其他', ts: entry.ts, likes: 0 });
  try { localStorage.setItem('freed-my-gains', JSON.stringify(myItems)); } catch(e) {}

  // 写云端收获本
  try {
    await supaFetch('/rest/v1/gain_entries', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify(entry),
      useAuth: !!u
    });
  } catch(_) {}

  // 删除这个目标（登录则删云端，本地都删）
  if (goal.id) cancelGoalReminder(goal.id);
  if (u && goal.id) {
    try { await deleteGoalFromCloud(goal.id); } catch(_) {}
  }
  goals.splice(i, 1);
  saveGoals(goals);
  renderGoals();
  showToast('✨ 目标已掉落并记录到收获本');
}


// ════════════════════════════════════════
// 打卡 + 定时提醒
// ════════════════════════════════════════
var currentGoalIndex = -1;
var CHECKINS = {};   // { goalId: { 'YYYY-MM-DD': true } }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
async function loadCheckins() {
  var u = readGoalsUserFromStorage();
  if (!u) return;
  var rows = await supaFetch('/rest/v1/goal_checkins?user_id=eq.' + u.id + '&select=goal_id,checkin_date&limit=10000', { useAuth: true });
  if (!Array.isArray(rows)) return;
  CHECKINS = {};
  rows.forEach(function(r) {
    if (!CHECKINS[r.goal_id]) CHECKINS[r.goal_id] = {};
    CHECKINS[r.goal_id][r.checkin_date] = true;
  });
}
function checkedToday(g) { return !!(g && g.id && CHECKINS[g.id] && CHECKINS[g.id][todayStr()]); }
function checkinCount(g) {
  if (!g || !g.id || !CHECKINS[g.id]) return 0;
  var start = g.plan_start || '';
  return Object.keys(CHECKINS[g.id]).filter(function(d) { return d >= start; }).length;
}
function goalMetaText(g) {
  var parts = [];
  if (g.reminder_time) parts.push('⏰ ' + g.reminder_time);
  var n = checkinCount(g);
  if (g.target_days) parts.push(n >= g.target_days ? '🎉 已完成 ' + g.target_days + ' 天' : '已打卡 ' + n + ' / ' + g.target_days + ' 天');
  else if (n > 0) parts.push('已打卡 ' + n + ' 天');
  if (checkedToday(g)) parts.push('今日已打卡 ✓');
  return parts.join(' · ');
}
async function patchGoal(g, fields) {
  if (!g.id) return false;
  var rows = await supaFetch('/rest/v1/user_goals?id=eq.' + encodeURIComponent(g.id), {
    method: 'PATCH', body: JSON.stringify(fields), useAuth: true
  });
  if (!Array.isArray(rows) || !rows.length) return false;
  var goals = getGoals();
  goals.forEach(function(x) { if (x.id === g.id) Object.assign(x, fields); });
  saveGoals(goals);
  return true;
}
function currentGoal() { return getGoals()[currentGoalIndex]; }
function needCloud(g) {
  if (g && g.id && readGoalsUserFromStorage()) return true;
  showToast('请先登录后再使用打卡和提醒');
  return false;
}

// ── 详情弹窗 ──
function openModal(i) {
  var g = getGoals()[i];
  if (!g) return;
  currentGoalIndex = i;
  document.getElementById('modalBadge').textContent = (CAT_ICONS[g.cat] || '✨') + ' ' + (g.cat || '');
  document.getElementById('modalText').textContent = g.text;
  refreshModal();
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
function refreshModal() {
  var g = currentGoal();
  if (!g) return;
  document.getElementById('reminderBtnText').textContent = g.reminder_time ? '每天 ' + g.reminder_time : '设置提醒';
  document.getElementById('daysBtnText').textContent = g.target_days ? g.target_days + '天' : '打卡天数';
  var done = checkedToday(g);
  document.getElementById('checkinBtn').classList.toggle('done', done);
  document.getElementById('checkinBtnIcon').textContent = done ? '✅' : '🌱';
  document.getElementById('checkinBtnText').textContent = done ? '今日已打卡' : '今日打卡';
  var n = checkinCount(g), el = document.getElementById('progressDisplay');
  el.classList.remove('complete');
  if (g.target_days) {
    if (n >= g.target_days) { el.textContent = '🎉 已完成 ' + g.target_days + ' 天'; el.classList.add('complete'); }
    else el.textContent = '已打卡 ' + n + ' / ' + g.target_days + ' 天';
  } else {
    el.textContent = n > 0 ? '已打卡 ' + n + ' 天' : '未设定天数';
  }
}
function dropFromModal() { var i = currentGoalIndex; closeModal(); dropGoal(i); }

// ── 今日打卡 ──
var checkinBusy = false;
async function checkinToday() {
  var g = currentGoal();
  if (!needCloud(g)) return;
  if (checkedToday(g)) { showToast('今天已经打过卡了 🌱'); return; }
  if (checkinBusy) return;
  checkinBusy = true;
  var u = readGoalsUserFromStorage();
  var day = todayStr();
  var rows = await supaFetch('/rest/v1/goal_checkins', {
    method: 'POST', body: JSON.stringify({ goal_id: g.id, user_id: u.id, checkin_date: day }), useAuth: true
  });
  if (!Array.isArray(rows)) { await loadCheckins(); }   // 可能是重复打卡，重新读一次
  else { if (!CHECKINS[g.id]) CHECKINS[g.id] = {}; CHECKINS[g.id][day] = true; }
  checkinBusy = false;
  if (!checkedToday(g)) { showToast('打卡失败，请检查网络后重试'); return; }
  refreshModal(); renderGoals();
  var n = checkinCount(g);
  showToast(g.target_days && n >= g.target_days ? '🎉 恭喜完成 ' + g.target_days + ' 天打卡！' : '🌱 打卡成功');
}

// ── 打卡天数 ──
function openDays() {
  var g = currentGoal();
  if (!needCloud(g)) return;
  document.getElementById('customDaysInput').value = g.target_days || '';
  document.querySelectorAll('#daysOverlay .day-chip').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.textContent) === g.target_days);
  });
  document.getElementById('daysOverlay').style.display = 'flex';
}
function closeDays() { document.getElementById('daysOverlay').style.display = 'none'; }
function selectDays(n, btn) {
  document.getElementById('customDaysInput').value = n;
  document.querySelectorAll('#daysOverlay .day-chip').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}
async function saveDays() {
  var g = currentGoal();
  var val = parseInt(document.getElementById('customDaysInput').value);
  if (!g || !val || val <= 0 || val > 365) { showToast('请输入 1–365 天'); return; }
  // 进行中的计划保留开始日期；没有计划或已完成则从今天重新开始
  var keepStart = g.plan_start && !(g.target_days && checkinCount(g) >= g.target_days);
  var ok = await patchGoal(g, { target_days: val, plan_start: keepStart ? g.plan_start : todayStr() });
  if (!ok) { showToast('保存失败，请检查网络后重试'); return; }
  closeDays(); refreshModal(); renderGoals();
}

// ── 提醒时间 ──
function isNativeApp() {
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications);
}
function reminderIdFor(goalId) {
  var h = 0;
  for (var i = 0; i < goalId.length; i++) { h = (h * 31 + goalId.charCodeAt(i)) | 0; }
  return 100000 + (Math.abs(h) % 800000);   // 避开 1001 / 1002
}
function openReminder() {
  var g = currentGoal();
  if (!needCloud(g)) return;
  document.getElementById('reminderTimeInput').value = g.reminder_time || '21:00';
  document.getElementById('reminderOffRow').style.display = g.reminder_time ? 'block' : 'none';
  document.getElementById('reminderOverlay').style.display = 'flex';
}
function closeReminder() { document.getElementById('reminderOverlay').style.display = 'none'; }
async function saveReminder() {
  var g = currentGoal();
  var val = document.getElementById('reminderTimeInput').value;
  if (!g || !/^\d{2}:\d{2}$/.test(val)) return;
  if (isNativeApp()) {
    var granted = await ensureNotifyPermission();
    if (!granted) { showToast('请先在系统设置里允许 Freed 发送通知'); return; }
  }
  var ok = await patchGoal(g, { reminder_time: val });
  if (!ok) { showToast('保存失败，请检查网络后重试'); return; }
  await scheduleGoalReminder(currentGoal());
  closeReminder(); refreshModal(); renderGoals();
  showToast(isNativeApp() ? '⏰ 每天 ' + val + ' 提醒你' : '已保存，提醒会在 App 里推送');
}
async function clearReminder() {
  var g = currentGoal();
  if (!g) return;
  var ok = await patchGoal(g, { reminder_time: null });
  if (!ok) { showToast('保存失败，请检查网络后重试'); return; }
  cancelGoalReminder(g.id);
  closeReminder(); refreshModal(); renderGoals();
  showToast('已关闭提醒');
}
async function ensureNotifyPermission() {
  try {
    var LN = window.Capacitor.Plugins.LocalNotifications;
    var p = await LN.checkPermissions();
    if (p.display === 'granted') return true;
    p = await LN.requestPermissions();
    return p.display === 'granted';
  } catch(_) { return false; }
}
async function scheduleGoalReminder(g) {
  if (!isNativeApp() || !g || !g.id || !g.reminder_time) return;
  var LN = window.Capacitor.Plugins.LocalNotifications;
  var hm = g.reminder_time.split(':');
  var id = reminderIdFor(g.id);
  var text = g.text.length > 30 ? g.text.slice(0, 30) + '…' : g.text;
  try {
    await LN.cancel({ notifications: [{ id: id }] });
    await LN.schedule({ notifications: [{
      id: id,
      title: '释放打卡时间到了',
      body: '今天为「' + text + '」释放了吗？',
      schedule: { on: { hour: parseInt(hm[0], 10), minute: parseInt(hm[1], 10) }, repeats: true, allowWhileIdle: true },
      extra: { type: 'goal-reminder', goalId: g.id }
    }] });
  } catch(e) { console.warn('schedule reminder failed', e); }
}
function cancelGoalReminder(goalId) {
  if (!isNativeApp() || !goalId) return;
  try { window.Capacitor.Plugins.LocalNotifications.cancel({ notifications: [{ id: reminderIdFor(goalId) }] }); } catch(_) {}
}
// 每次进目标表：清掉已删除目标的提醒，补上换设备后缺的提醒
async function syncAllReminders() {
  if (!isNativeApp() || !readGoalsUserFromStorage()) return;
  var LN = window.Capacitor.Plugins.LocalNotifications;
  try {
    var pending = await LN.getPending();
    var stale = (pending.notifications || []).filter(function(n) { return n.id >= 100000 && n.id < 900000; })
      .map(function(n) { return { id: n.id }; });
    if (stale.length) await LN.cancel({ notifications: stale });
    var goals = getGoals().filter(function(g) { return g.id && g.reminder_time; });
    if (!goals.length) return;
    var p = await LN.checkPermissions();
    if (p.display !== 'granted') return;
    for (var i = 0; i < goals.length; i++) await scheduleGoalReminder(goals[i]);
  } catch(e) { console.warn('sync reminders failed', e); }
}

// ════════════════════════════════════════
// 启动：登录用户拉云端覆盖本地，未登录用本地
// ════════════════════════════════════════
(async function initGoals() {
  var u = readGoalsUserFromStorage();
  if (u) {
    // 登录用户：直接拉云端，覆盖本地（登录前的本地目标会被丢弃）
    var cloudGoals = await loadGoalsFromCloud();
    saveGoals(cloudGoals || []);
    await loadCheckins();
  }
  // 渲染（登录用户用云端，未登录用本地）
  renderGoals();
  syncAllReminders();
  // 从提醒推送点进来：goals.html?goal=<id> 直接打开该目标
  try {
    var gid = new URLSearchParams(location.search).get('goal');
    if (gid) {
      var idx = getGoals().findIndex(function(g) { return g.id === gid; });
      if (idx >= 0) openModal(idx);
      history.replaceState(null, '', location.pathname);
    }
  } catch(_) {}
})();
</script>
