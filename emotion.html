<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>情绪签到 · Freed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Noto Serif SC', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}

.sheet {
  width: 100%;
  max-width: 420px;
  background: linear-gradient(135deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.45) 40%, rgba(220,235,255,0.55) 70%, rgba(255,255,255,0.60) 100%);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.70);
  padding: 20px 16px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  box-shadow: 0 8px 32px rgba(0,60,120,0.12);
}

.handle {
  width: 36px; height: 4px;
  background: rgba(100,140,200,0.35);
  border-radius: 2px;
}

.title {
  font-size: 1.05rem;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: rgba(3,80,140,0.9);
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  width: 100%;
}

.emotion-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 2px;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.emotion-btn.selected {
  border-color: rgba(74,159,212,0.75);
  background: rgba(200,230,255,0.45);
}

.emotion-btn img {
  width: 100%;
  height: auto;
  object-fit: contain;
}

.emotion-name {
  font-size: 0.75rem;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1a3050;
  text-align: center;
}

.confirm-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4a9fd4, #2a7abf);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-family: 'Noto Serif SC', serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  cursor: pointer;
}

.confirm-btn:disabled {
  background: rgba(180,200,220,0.55);
  color: rgba(100,140,180,0.7);
  cursor: default;
}

.skip-btn {
  font-size: 0.8rem;
  font-family: 'Noto Sans SC', sans-serif;
  color: rgba(100,140,180,0.75);
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px 0;
}

.done-view {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
  width: 100%;
}

.done-view img { width: 90px; height: 90px; object-fit: contain; }
.done-text { font-size: 1rem; letter-spacing: 0.1em; color: rgba(3,80,140,0.85); }
.done-sub { font-size: 0.78rem; font-family: 'Noto Sans SC', sans-serif; color: rgba(80,120,170,0.7); }
</style>
</head>
<body>

<script>
(function() {
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
  document.body.insertBefore(canvas, document.body.firstChild);
  var ctx = canvas.getContext('2d');
  var W, H, t = 0;
  var COLORS = [{r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},{r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},{r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224}];
  function Bubble(fromBottom) { this.reset(fromBottom); }
  Bubble.prototype.reset = function(fromBottom) {
    this.x=Math.random()*W; this.y=fromBottom?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2);
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30);
    this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
  };
  Bubble.prototype.update = function() {
    this.life++;
    this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp;
    this.y+=this.vy;
    var p=this.life/this.maxLife;
    if(p<0.08) this.opacity=(p/0.08)*0.25;
    else if(p>0.85) this.opacity*=0.97;
    if(this.y<-this.r*3||this.life>this.maxLife) this.reset(true);
  };
  Bubble.prototype.draw = function() {
    var x=this.x,y=this.y,r=this.r,a=this.opacity,cr=this.color.r,cg=this.color.g,cb=this.color.b;
    var glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,'rgba('+cr+','+cg+','+cb+','+a*0.65+')');
    glow.addColorStop(1,'rgba('+cr+','+cg+','+cb+',0)');
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    var shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0,'rgba(255,255,255,'+a*0.70+')');
    shell.addColorStop(0.55,'rgba('+cr+','+cg+','+cb+','+a*0.48+')');
    shell.addColorStop(1,'rgba('+cr+','+cg+','+cb+','+a*0.75+')');
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle='rgba('+cr+','+cg+','+cb+','+a*0.90+')';
    ctx.lineWidth=Math.max(0.5,r*0.06);ctx.stroke();
  };
  var bubbles=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  function draw(){
    requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');
    bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    for(var i=0;i<bubbles.length;i++){bubbles[i].update();bubbles[i].draw();}
  }
  window.addEventListener('resize',resize);resize();
  for(var i=0;i<55;i++) bubbles.push(new Bubble(i>20));
  draw();
})();
</script>

<div class="sheet" id="sheet">
  <div class="handle"></div>
  <p class="title">此刻你在哪种情绪里？</p>
  <div class="grid" id="grid"></div>
  <button class="confirm-btn" id="confirmBtn" disabled>确 认</button>
  <button class="skip-btn" id="skipBtn">跳过</button>
  <div class="done-view" id="doneView">
    <img id="doneChar" src="" alt="">
    <p class="done-text" id="doneText"></p>
    <p class="done-sub">已记录，继续加油 🌊</p>
  </div>
</div>
