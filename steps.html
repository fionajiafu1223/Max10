<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>步骤释放 · Freed Releasing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:'Noto Sans SC', sans-serif;
    background: linear-gradient(180deg, #b8daf5 0%, #6aaee0 38%, #2e82cc 62%, #0f4a8a 100%);
    background-attachment: fixed;
    color: rgba(255,255,255,0.94);
    min-height:100%;
  }
  .wrap {
    width:min(92vw, 520px); margin:0 auto;
    padding: calc(max(22px, env(safe-area-inset-top, 0px) + 8px) + 84px) 0 calc(140px + env(safe-area-inset-bottom, 0px));
  }
  h1 {
    font-family:'Noto Serif SC', serif; font-weight:400;
    font-size:1.25rem; letter-spacing:0.18em; text-align:center;
    text-shadow:0 1px 8px rgba(0,50,110,0.3);
  }
  .sub {
    text-align:center; font-size:0.72rem; letter-spacing:0.06em;
    color:rgba(235,248,255,0.8); margin:8px 0 26px; line-height:1.7;
  }
  .glass {
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.34);
    border-radius: 18px;
  }
  .label {
    font-size:0.64rem; letter-spacing:0.14em; color:rgba(225,243,255,0.78);
    margin:0 4px 8px;
  }
  .goal-box { padding:4px; margin-bottom:24px; }
  .goal-box textarea {
    width:100%; border:none; background:transparent; resize:none;
    font-family:'Noto Serif SC', serif; font-size:0.92rem; line-height:1.6;
    color:#fff; padding:10px 14px; outline:none; letter-spacing:0.04em;
  }
  textarea::placeholder, input::placeholder { color:rgba(230,245,255,0.55); }

  .steps { list-style:none; display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .step {
    display:flex; align-items:center; gap:8px;
    padding:8px 8px 8px 10px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .step.dragging {
    transform: scale(1.03);
    box-shadow: 0 10px 28px rgba(0,40,100,0.3);
    background: rgba(255,255,255,0.28);
    z-index:5; position:relative; transition:none;
  }
  .num {
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif SC', serif; font-size:0.78rem;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85), rgba(255,255,255,0.18) 45%, rgba(120,190,240,0.25));
    border:1px solid rgba(255,255,255,0.6);
    color:#0f4a8a; font-weight:600;
  }
  .step-text {
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:'Noto Serif SC', serif; font-size:0.86rem; color:#fff;
    line-height:1.5; letter-spacing:0.03em; resize:none; overflow:hidden;
    padding:4px 2px;
  }
  .icon-btn {
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.14); color:rgba(255,255,255,0.85);
    font-size:0.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active { transform:scale(0.9); }
  .icon-btn:disabled { opacity:0.25; }
  .icon-btn.del:hover { background:rgba(220,80,80,0.3); }
  .handle {
    flex:0 0 auto; width:28px; height:34px; cursor:grab; touch-action:none;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.6); font-size:1rem; letter-spacing:-2px;
  }
  .empty {
    text-align:center; font-size:0.74rem; color:rgba(230,245,255,0.7);
    padding:22px 0; letter-spacing:0.06em;
  }
  .add-row { display:flex; gap:8px; padding:4px; }
  .add-row input {
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:'Noto Serif SC', serif; font-size:0.86rem; color:#fff;
    padding:10px 12px;
  }
  .add-row button {
    border:none; border-radius:14px; padding:0 18px;
    background:rgba(255,255,255,0.88); color:#1a3a66;
    font-family:'Noto Serif SC', serif; font-size:0.8rem; font-weight:600; cursor:pointer;
  }
  .hint { font-size:0.62rem; color:rgba(225,243,255,0.62); text-align:center; margin-top:12px; letter-spacing:0.05em; }

  .bottom {
    position:fixed; left:0; right:0; bottom:0;
    padding: 18px 0 calc(22px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background: linear-gradient(180deg, rgba(15,74,138,0) 0%, rgba(15,74,138,0.75) 45%);
  }
  .start-btn {
    width:min(80vw, 320px); height:52px; border-radius:99px; border:none;
    background: radial-gradient(circle at 38% 30%, rgba(255,255,255,0.98), rgba(200,220,240,0.9));
    color:#0f3c70; font-family:'Noto Serif SC', serif; font-size:0.95rem;
    font-weight:600; letter-spacing:0.2em; cursor:pointer;
    box-shadow:0 6px 24px rgba(0,30,80,0.3);
    transition: opacity 0.2s, transform 0.15s;
  }
  .start-btn:active { transform:scale(0.97); }
  .start-btn:disabled { opacity:0.4; cursor:default; }
  .start-note { font-size:0.62rem; color:rgba(220,240,255,0.7); letter-spacing:0.06em; }

  .toast {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,40,80,0.75); color:#fff; padding:10px 18px; border-radius:14px;
    font-size:0.78rem; opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:50;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>步骤释放</h1>
  <p class="sub">把目标拆成几个行动步骤<br>再逐一释放每一步里的欲望</p>

  <div class="label">我的目标</div>
  <div class="glass goal-box">
    <textarea id="goal" rows="2" maxlength="200" placeholder="写下你想实现的目标…"></textarea>
  </div>

  <div class="label">行动步骤</div>
  <ul class="steps" id="steps"></ul>

  <div class="glass add-row">
    <input id="stepInput" type="text" maxlength="200" placeholder="写下一个步骤…" enterkeyhint="done">
    <button id="addBtn">添加</button>
  </div>
  <p class="hint">按住 ⋮⋮ 拖动，或用 ↑↓ 调整顺序 · 点击文字可修改</p>
</div>

<div class="bottom">
  <button class="start-btn" id="startBtn" disabled>开始释放</button>
  <div class="start-note" id="startNote">至少写下一个步骤</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var KEY = 'stepsDraft';
  var state = load();

  var goalEl  = document.getElementById('goal');
  var listEl  = document.getElementById('steps');
  var inputEl = document.getElementById('stepInput');
  var startEl = document.getElementById('startBtn');
  var noteEl  = document.getElementById('startNote');

  goalEl.value = state.goal || '';
  render();

  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && Array.isArray(d.steps)) return d;
    } catch(_) {}
    return { goal:'', steps:[] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(_) {}
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function autoSize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  function render() {
    listEl.innerHTML = '';
    if (!state.steps.length) {
      listEl.innerHTML = '<li class="empty">还没有步骤，从第一步开始写吧 🌊</li>';
    }
    state.steps.forEach(function(text, i) {
      var li = document.createElement('li');
      li.className = 'step glass';
      li.dataset.idx = i;
      li.innerHTML =
        '<div class="handle" title="拖动排序">⋮⋮</div>' +
        '<div class="num">' + (i + 1) + '</div>' +
        '<textarea class="step-text" rows="1" maxlength="200"></textarea>' +
        '<button class="icon-btn up" aria-label="上移">↑</button>' +
        '<button class="icon-btn down" aria-label="下移">↓</button>' +
        '<button class="icon-btn del" aria-label="删除">✕</button>';
      var ta = li.querySelector('.step-text');
      ta.value = text;
      ta.addEventListener('input', function() {
        state.steps[i] = ta.value; save(); autoSize(ta);
      });
      ta.addEventListener('blur', function() {
        if (!ta.value.trim()) { state.steps.splice(i, 1); save(); render(); }
      });
      var up = li.querySelector('.up'), down = li.querySelector('.down');
      up.disabled = i === 0;
      down.disabled = i === state.steps.length - 1;
      up.onclick = function() { move(i, i - 1); };
      down.onclick = function() { move(i, i + 1); };
      li.querySelector('.del').onclick = function() {
        state.steps.splice(i, 1); save(); render();
      };
      initDrag(li.querySelector('.handle'), li);
      listEl.appendChild(li);
      requestAnimationFrame(function(){ autoSize(ta); });
    });
    var ok = state.steps.some(function(s){ return s.trim(); });
    startEl.disabled = !ok;
    noteEl.textContent = ok ? ('共 ' + state.steps.length + ' 步，将依次释放') : '至少写下一个步骤';
  }

  function move(from, to) {
    if (to < 0 || to >= state.steps.length || from === to) return;
    var item = state.steps.splice(from, 1)[0];
    state.steps.splice(to, 0, item);
    save(); render();
  }

  // ── 拖动排序（鼠标和手指通用）──
  function initDrag(handle, li) {
    handle.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      var from = parseInt(li.dataset.idx, 10);
      var startY = e.clientY;
      var items = Array.prototype.slice.call(listEl.querySelectorAll('.step'));
      var rects = items.map(function(el){ return el.getBoundingClientRect(); });
      var to = from;
      li.classList.add('dragging');
      try { handle.setPointerCapture(e.pointerId); } catch(_) {}

      function onMove(ev) {
        var dy = ev.clientY - startY;
        li.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
        var cy = rects[from].top + rects[from].height / 2 + dy;
        to = from;
        for (var k = 0; k < rects.length; k++) {
          if (k !== from && cy > rects[k].top && cy < rects[k].bottom) { to = k; break; }
        }
        if (cy < rects[0].top) to = 0;
        if (cy > rects[rects.length - 1].bottom) to = rects.length - 1;
        items.forEach(function(el, k) {
          if (k === from) return;
          var shift = 0, h = rects[from].height + 10;
          if (from < to && k > from && k <= to) shift = -h;
          if (from > to && k < from && k >= to) shift = h;
          el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
        });
      }
      function onUp() {
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        items.forEach(function(el){ el.style.transform = ''; });
        li.classList.remove('dragging');
        if (to !== from) move(from, to);
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  }

  function addStep() {
    var v = inputEl.value.trim();
    if (!v) return;
    state.steps.push(v);
    inputEl.value = '';
    save(); render();
    inputEl.focus();
  }
  document.getElementById('addBtn').onclick = addStep;
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addStep(); }
  });
  goalEl.addEventListener('input', function() { state.goal = goalEl.value; save(); });

  startEl.onclick = function() {
    var steps = state.steps.map(function(s){ return s.trim(); }).filter(Boolean);
    if (!steps.length) return;
    if (inputEl.value.trim()) { toast('输入框里还有未添加的步骤'); return; }
    try {
      sessionStorage.setItem('releaseSteps', JSON.stringify({
        goal: (state.goal || '').trim(), steps: steps, idx: 0
      }));
    } catch(_) {}
    window.location.href = 'desire.html';
  };
})();
</script>
<script src="nav-orb.js"></script>
</body>
</html>
