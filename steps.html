<!DOCTYPE html>
<html lang="zh">
<head>
<script src="supabase-client.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>步骤释放 · Freed Releasing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:'Noto Sans SC', sans-serif;
    background: transparent;
    color: #0e2840;
    min-height:100%;
  }
  .wrap {
    width:min(92vw, 520px); margin:0 auto;
    padding: calc(max(22px, env(safe-area-inset-top, 0px) + 8px) + 84px) 0 calc(140px + env(safe-area-inset-bottom, 0px));
  }
  h1 {
    font-family:'Noto Serif SC', serif; font-weight:400;
    font-size:1.2rem; letter-spacing:0.18em; text-align:center;
    color: rgba(3,80,140,0.75);
  }
  .sub {
    text-align:center; font-size:0.72rem; letter-spacing:0.06em;
    color:rgba(60,120,180,0.7); margin:8px 0 26px; line-height:1.7;
  }
  .card {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,60,120,0.08);
  }
  .label {
    font-size:0.66rem; letter-spacing:0.12em; color:#5a7aa0;
    font-family:'Noto Sans SC', sans-serif;
    margin:0 4px 8px;
  }

  /* ── View 1: 目标列表 ── */
  #viewGoals { display:block; }
  #viewSteps { display:none; }

  .goal-picker { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .goal-opt {
    display:flex; align-items:center; gap:10px; width:100%;
    padding:12px 16px; cursor:pointer; text-align:left;
    color:#0e2840;
    font-family:'Noto Serif SC', serif; font-size:0.92rem; letter-spacing:0.04em; line-height:1.5;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .goal-opt .gtext { flex:1; min-width:0; }
  .goal-opt .gcnt { flex:0 0 auto; font-family:'Noto Sans SC', sans-serif; font-size:0.64rem; color:#5a7aa0; letter-spacing:0.04em; }
  .goal-opt:hover { background:rgba(74,159,212,0.08); }
  .goal-empty a { color:#2a6090; }

  /* ── View 2: 步骤编辑 ── */
  .back-row {
    display:flex; align-items:center; gap:8px; margin-bottom:20px;
  }
  .back-btn {
    border:none; background:rgba(100,160,220,0.12); color:#2a6090;
    border-radius:99px; padding:6px 16px;
    font-family:'Noto Sans SC', sans-serif; font-size:0.76rem;
    cursor:pointer; letter-spacing:0.06em;
  }
  .current-goal-text {
    flex:1; font-family:'Noto Serif SC', serif; font-size:0.9rem;
    color:#0e2840; letter-spacing:0.04em; line-height:1.5;
  }

  .steps { list-style:none; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .step {
    display:flex; align-items:center; gap:8px;
    padding:8px 8px 8px 10px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .step.dragging {
    transform: scale(1.03);
    box-shadow: 0 10px 28px rgba(0,60,120,0.15);
    background: rgba(255,255,255,0.95);
    z-index:5; position:relative; transition:none;
  }
  .num {
    flex:0 0 auto; min-width:22px; text-align:right;
    font-family:'Noto Serif SC', serif; font-size:0.82rem;
    color:rgba(60,120,180,0.55); letter-spacing:0.02em;
  }
  .step-text {
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:'Noto Serif SC', serif; font-size:0.92rem; color:#0e2840;
    line-height:1.5; letter-spacing:0.03em; resize:none; overflow:hidden;
    padding:4px 2px;
  }
  .icon-btn {
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(100,160,220,0.12); color:rgba(40,100,180,0.7);
    font-size:0.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active { transform:scale(0.9); }
  .icon-btn:disabled { opacity:0.25; }
  .icon-btn.del:hover { background:rgba(220,80,80,0.15); color:#c04040; }
  .handle {
    flex:0 0 auto; width:28px; height:34px; cursor:grab; touch-action:none;
    display:flex; align-items:center; justify-content:center;
    color:rgba(100,150,200,0.5); font-size:1rem; letter-spacing:-2px;
  }
  .empty {
    text-align:center; font-size:0.76rem; color:rgba(80,130,180,0.6);
    padding:22px 0; letter-spacing:0.06em;
  }
  .add-row { display:flex; gap:8px; padding:4px; }
  .add-row input {
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:'Noto Serif SC', serif; font-size:0.92rem; color:#0e2840;
    padding:10px 12px;
  }
  .add-row button {
    border:none; border-radius:14px; padding:0 18px;
    background:rgba(60,130,220,0.85); color:#fff;
    font-family:'Noto Sans SC', sans-serif; font-size:0.82rem; font-weight:600; cursor:pointer;
  }
  textarea::placeholder, input::placeholder { color:rgba(80,130,180,0.45); }
  .clear-btn {
    display:block; margin:14px auto 0; background:none; border:none;
    color:rgba(80,130,180,0.55); font-size:0.66rem; letter-spacing:0.08em;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px 10px;
  }
  .hint { font-size:0.64rem; color:rgba(80,130,180,0.55); text-align:center; margin-top:12px; letter-spacing:0.05em; }

  .bottom {
    position:fixed; left:0; right:0; bottom:0;
    padding: 18px 0 calc(22px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background: linear-gradient(180deg, rgba(210,232,255,0) 0%, rgba(210,232,255,0.85) 50%);
  }
  /* 底栏：目标列表时隐藏，步骤编辑时显示 */
  .bottom.hidden { display:none; }
  .start-btn {
    width:min(80vw, 320px); height:52px; border-radius:99px; border:none;
    background: linear-gradient(135deg, rgba(74,159,212,0.92), rgba(42,122,191,0.92));
    color:#fff; font-family:'Noto Serif SC', serif; font-size:0.95rem;
    font-weight:600; letter-spacing:0.2em; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,80,160,0.22);
    transition: opacity 0.2s, transform 0.15s;
  }
  .start-btn:active { transform:scale(0.97); }
  .start-btn:disabled { opacity:0.35; cursor:default; }
  .start-note { font-size:0.64rem; color:rgba(40,90,150,0.65); letter-spacing:0.06em; }

  .toast {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,50,100,0.82); color:#fff; padding:10px 18px; border-radius:14px;
    font-size:0.78rem; opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:50;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<script>
(function() {
var canvas = document.createElement('canvas');
canvas.id = 'bgCanvas';
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;
const EMOTION_COLORS = [
  {r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},
  {r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},
  {r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224},
];
class Bubble {
  constructor(fromBottom) { this.reset(fromBottom); }
  reset(startAtBottom) {
    this.x=Math.random()*W; this.y=startAtBottom?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2);
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30); this.color=EMOTION_COLORS[Math.floor(Math.random()*EMOTION_COLORS.length)];
  }
  update(t) {
    this.life++; this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp; this.y+=this.vy;
    const p=this.life/this.maxLife;
    if(p<0.08) this.opacity=(p/0.08)*(0.25+Math.random()*0.01);
    else if(p>0.85) this.opacity*=0.97;
    if(this.y<-this.r*3||this.life>this.maxLife) this.reset(true);
  }
  draw() {
    const x=this.x,y=this.y,r=this.r,a=this.opacity,{r:cr,g:cg,b:cb}=this.color;
    const glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,`rgba(${cr},${cg},${cb},${a*0.65})`);
    glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    const shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0.00,`rgba(255,255,255,${a*0.70})`);
    shell.addColorStop(0.12,`rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55,`rgba(${cr},${cg},${cb},${a*0.48})`);
    shell.addColorStop(0.82,`rgba(${cr},${cg},${cb},${a*0.62})`);
    shell.addColorStop(1.00,`rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a*0.90})`;ctx.lineWidth=Math.max(0.5,r*0.06);ctx.stroke();
    const sp=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0,`rgba(255,255,255,${Math.min(1,a*1.6)})`);sp.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
    const sp2=ctx.createRadialGradient(x+r*0.38,y+r*0.30,0,x+r*0.38,y+r*0.30,r*0.14);
    sp2.addColorStop(0,`rgba(255,255,255,${a*0.38})`);sp2.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp2;ctx.fill();
  }
}
const BUBBLES=Array.from({length:55},(_,i)=>new Bubble(i>20));
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function draw(){
  requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');
  bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  BUBBLES.forEach(function(b){b.update(t);b.draw();});
}
window.addEventListener('resize',resize);resize();draw();
})();
</script>
<div class="wrap">

  <!-- View 1: 目标列表 -->
  <div id="viewGoals">
    <h1>步骤释放</h1>
    <p class="sub">把目标拆成几个行动步骤<br>再逐一释放每一步里的欲望</p>
    <div class="label">选择一个目标</div>
    <div class="goal-picker" id="goalPicker"><div class="empty">加载目标中…</div></div>
  </div>

  <!-- View 2: 步骤编辑 -->
  <div id="viewSteps">
    <div class="back-row">
      <button class="back-btn" id="backBtn">← 返回</button>
      <span class="current-goal-text" id="currentGoalText"></span>
    </div>
    <div class="label">行动步骤</div>
    <ul class="steps" id="steps"></ul>
    <div class="card add-row">
      <input id="stepInput" type="text" maxlength="200" placeholder="写下一个步骤…" enterkeyhint="done">
      <button id="addBtn">添加</button>
    </div>
    <p class="hint">按住 ⋮⋮ 拖动，或用 ↑↓ 调整顺序 · 点击文字可修改</p>
    <button class="clear-btn" id="clearBtn" hidden>清空这个目标的步骤</button>
  </div>

</div>

<div class="bottom hidden" id="bottom">
  <button class="start-btn" id="startBtn" disabled>开始释放</button>
  <div class="start-note" id="startNote">至少写下一个步骤</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  var SUPA_URL = 'https://ryoaxziysgdkjcjiuqti.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5b2F4eml5c2dka2pjaml1cXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDg2MDAsImV4cCI6MjA4OTA4NDYwMH0.ORG_8Ue8LjYfReMvKo1iQOFNGN7fcTz1_fMs8Gq1Kds';
  var STORE = 'stepsByGoal';
  var sfetch = window.freedFetch || window.fetch.bind(window);

  var goals = [];
  var currentId = null;
  var store = readStore();
  var state = { goal:'', steps:[] };

  var viewGoals = document.getElementById('viewGoals');
  var viewSteps = document.getElementById('viewSteps');
  var pickerEl  = document.getElementById('goalPicker');
  var listEl    = document.getElementById('steps');
  var inputEl   = document.getElementById('stepInput');
  var startEl   = document.getElementById('startBtn');
  var noteEl    = document.getElementById('startNote');
  var bottomEl  = document.getElementById('bottom');
  var clearEl   = document.getElementById('clearBtn');

  function readStore() {
    try { var d = JSON.parse(localStorage.getItem(STORE) || '{}'); return (d && typeof d === 'object') ? d : {}; }
    catch(_) { return {}; }
  }
  function save() {
    if (!currentId) return;
    if (state.steps.length) store[currentId] = state.steps.slice();
    else delete store[currentId];
    try { localStorage.setItem(STORE, JSON.stringify(store)); } catch(_) {}
  }
  function readUser() {
    try {
      var obj = JSON.parse(localStorage.getItem('sb-ryoaxziysgdkjcjiuqti-auth-token') || 'null');
      var token = obj && obj.access_token;
      if (!token) return null;
      var payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (!payload || !payload.sub) return null;
      return { id: payload.sub, token: token };
    } catch(_) { return null; }
  }
  function localGoals() {
    try {
      return (JSON.parse(localStorage.getItem('freed-goals') || '[]') || []).map(function(g) {
        return { id: String(g.id || ('local-' + g.ts)), text: g.text || '' };
      });
    } catch(_) { return []; }
  }
  async function loadGoals() {
    var u = readUser();
    if (u) {
      try {
        var res = await sfetch(SUPA_URL + '/rest/v1/user_goals?user_id=eq.' + u.id + '&select=id,text,ts&order=ts.desc', {
          headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + u.token }
        });
        if (res.ok) {
          var rows = await res.json();
          return rows.map(function(r) { return { id: String(r.id), text: r.text || '' }; });
        }
      } catch(_) {}
    }
    return localGoals();
  }
  function escapeHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── 视图切换 ──
  function showGoalList() {
    currentId = null;
    state = { goal:'', steps:[] };
    viewGoals.style.display = 'block';
    viewSteps.style.display = 'none';
    bottomEl.classList.add('hidden');
    renderPicker();
  }
  function showEditor(id) {
    var g = goals.find(function(x) { return x.id === id; });
    if (!g) return;
    currentId = id;
    state = { goal: g.text, steps: (store[id] || []).slice() };
    document.getElementById('currentGoalText').textContent = g.text;
    inputEl.value = '';
    viewGoals.style.display = 'none';
    viewSteps.style.display = 'block';
    bottomEl.classList.remove('hidden');
    render();
  }

  function renderPicker() {
    if (!goals.length) {
      pickerEl.innerHTML = '<div class="empty goal-empty">目标表里还没有目标<br><a href="goals.html">去目标表写下一个目标 →</a></div>';
      return;
    }
    pickerEl.innerHTML = '';
    goals.forEach(function(g) {
      var n = (store[g.id] || []).length;
      var b = document.createElement('button');
      b.className = 'goal-opt card';
      b.innerHTML = '<span class="gtext">' + escapeHtml(g.text) + '</span>' +
                    '<span class="gcnt">' + (n ? n + ' 步' : '未拆分') + '</span>';
      b.onclick = function() { showEditor(g.id); };
      pickerEl.appendChild(b);
    });
  }

  // 从 desire.html 返回时直接显示目标列表
  var fromDesire = (document.referrer.indexOf('desire.html') !== -1) ||
                   (location.search.indexOf('back=1') !== -1);
  // 默认显示目标列表
  showGoalList();

  loadGoals().then(function(list) {
    goals = list;
    renderPicker();
  });

  document.getElementById('backBtn').onclick = showGoalList;

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function autoSize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  function render() {
    listEl.innerHTML = '';
    if (!state.steps.length) {
      listEl.innerHTML = '<li class="empty">还没有步骤，从第一步开始写吧 🌊</li>';
    }
    state.steps.forEach(function(text, i) {
      var li = document.createElement('li');
      li.className = 'step card';
      li.dataset.idx = i;
      li.innerHTML =
        '<div class="handle" title="拖动排序">⋮⋮</div>' +
        '<div class="num">' + (i + 1) + '.</div>' +
        '<textarea class="step-text" rows="1" maxlength="200"></textarea>' +
        '<button class="icon-btn up" aria-label="上移">↑</button>' +
        '<button class="icon-btn down" aria-label="下移">↓</button>' +
        '<button class="icon-btn del" aria-label="删除">✕</button>';
      var ta = li.querySelector('.step-text');
      ta.value = text;
      ta.addEventListener('input', function() {
        state.steps[i] = ta.value; save(); autoSize(ta);
      });
      ta.addEventListener('blur', function() {
        if (!ta.value.trim()) { state.steps.splice(i, 1); save(); render(); }
      });
      var up = li.querySelector('.up'), down = li.querySelector('.down');
      up.disabled = i === 0;
      down.disabled = i === state.steps.length - 1;
      up.onclick = function() { move(i, i - 1); };
      down.onclick = function() { move(i, i + 1); };
      li.querySelector('.del').onclick = function() {
        state.steps.splice(i, 1); save(); render();
      };
      initDrag(li.querySelector('.handle'), li);
      listEl.appendChild(li);
      requestAnimationFrame(function(){ autoSize(ta); });
    });
    var ok = state.steps.some(function(s){ return s.trim(); });
    startEl.disabled = !ok;
    noteEl.textContent = ok ? ('共 ' + state.steps.length + ' 步，将依次释放') : '至少写下一个步骤';
    updateClear();
  }

  function move(from, to) {
    if (to < 0 || to >= state.steps.length || from === to) return;
    var item = state.steps.splice(from, 1)[0];
    state.steps.splice(to, 0, item);
    save(); render();
  }

  function initDrag(handle, li) {
    handle.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      var from = parseInt(li.dataset.idx, 10);
      var startY = e.clientY;
      var items = Array.prototype.slice.call(listEl.querySelectorAll('.step'));
      var rects = items.map(function(el){ return el.getBoundingClientRect(); });
      var to = from;
      li.classList.add('dragging');
      try { handle.setPointerCapture(e.pointerId); } catch(_) {}
      function onMove(ev) {
        var dy = ev.clientY - startY;
        li.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
        var cy = rects[from].top + rects[from].height / 2 + dy;
        to = from;
        for (var k = 0; k < rects.length; k++) {
          if (k !== from && cy > rects[k].top && cy < rects[k].bottom) { to = k; break; }
        }
        if (cy < rects[0].top) to = 0;
        if (cy > rects[rects.length - 1].bottom) to = rects.length - 1;
        items.forEach(function(el, k) {
          if (k === from) return;
          var shift = 0, h = rects[from].height + 10;
          if (from < to && k > from && k <= to) shift = -h;
          if (from > to && k < from && k >= to) shift = h;
          el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
        });
      }
      function onUp() {
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        items.forEach(function(el){ el.style.transform = ''; });
        li.classList.remove('dragging');
        if (to !== from) move(from, to);
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  }

  function addStep() {
    var v = inputEl.value.trim();
    if (!v) return;
    state.steps.push(v);
    inputEl.value = '';
    save(); render();
    inputEl.focus();
  }
  document.getElementById('addBtn').onclick = addStep;
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addStep(); }
  });

  function updateClear() { clearEl.hidden = !state.steps.length; }
  clearEl.onclick = function() {
    if (!confirm('清空这个目标的所有步骤？')) return;
    state.steps = [];
    inputEl.value = '';
    try { sessionStorage.removeItem('releaseSteps'); } catch(_) {}
    save(); render();
    inputEl.focus();
  };

  startEl.onclick = function() {
    var steps = state.steps.map(function(s){ return s.trim(); }).filter(Boolean);
    if (!steps.length) return;
    if (inputEl.value.trim()) { toast('输入框里还有未添加的步骤'); return; }
    try {
      sessionStorage.setItem('releaseSteps', JSON.stringify({
        goal: (state.goal || '').trim(), steps: steps, idx: 0
      }));
    } catch(_) {}
    window.location.href = 'desire.html';
  };
})();
</script>
<script src="nav-orb.js"></script>
</body>
</html>
