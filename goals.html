<title>目标表 · Freed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height:100vh; background:transparent; font-family:'Noto Serif SC',serif; padding:80px 16px 32px; }
.page-title { text-align:center; font-size:1.1rem; letter-spacing:0.2em; color:rgba(3,80,140,0.7); margin-bottom:24px; }
.page-wrap { max-width:480px; margin:0 auto; background:rgba(255,255,255,0.75); border-radius:20px; padding:20px 16px; box-shadow:0 8px 32px rgba(0,60,120,0.10); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.85); overflow:visible; }

/* 分类标签 */
.gain-cats { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.gain-cat {
  padding:4px 10px; border-radius:20px;
  border:1.5px solid rgba(100,160,220,0.4);
  background:rgba(255,255,255,0.55);
  font-family:'Noto Sans SC',sans-serif; font-size:0.72rem;
  color:#2a5080; cursor:pointer; transition:all 0.18s ease;
}
.gain-cat:hover { background:rgba(200,230,255,0.7); }
.gain-cat.active {
  background:linear-gradient(135deg,rgba(74,159,212,0.85),rgba(42,122,191,0.85));
  border-color:rgba(74,159,212,0.6); color:#fff;
}

/* 输入行 */
.goal-input-row { display:flex; gap:8px; margin-bottom:14px; }
.goal-input-row input {
  flex:1; padding:12px 16px;
  border:1.5px solid rgba(100,160,220,0.4); border-radius:14px;
  background:rgba(255,255,255,0.8); font-size:0.95rem; color:#0e2840; outline:none;
}
.goal-input-row button {
  padding:12px 20px; border:none; border-radius:14px;
  background:rgba(60,130,220,0.85); color:#fff; font-size:0.9rem;
  cursor:pointer; white-space:nowrap;
}

/* 目标广场入口 */
.plaza-row {
  display:flex; align-items:center; gap:10px;
  margin-bottom:16px; padding:10px 12px;
  background:rgba(255,255,255,0.5); border-radius:14px;
  border:1px solid rgba(100,160,220,0.2);
  overflow-x:auto; scrollbar-width:none;
}
.plaza-row::-webkit-scrollbar { display:none; }
.plaza-label {
  font-size:0.68rem; color:#5a7aa0;
  font-family:'Noto Sans SC',sans-serif;
  white-space:nowrap; flex-shrink:0;
}
.plaza-balls { display:flex; gap:8px; align-items:center; flex-shrink:0; }
.plaza-ball {
  width:70px; height:70px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:2px;
  cursor:pointer; flex-shrink:0;
  transition:transform 0.18s;
  font-size:0.52rem; font-family:'Noto Sans SC',sans-serif;
  color:rgba(255,255,255,0.92);
  outline:3px solid rgba(255,255,255,0.95);
  outline-offset:2px;
  box-shadow:0 0 0 5px rgba(138,170,192,0.35), 0 0 0 9px rgba(138,170,192,0.15);
}
.plaza-ball:hover { transform:scale(1.08); }
.plaza-ball .ball-icon { font-size:1.6rem; line-height:1; }
.plaza-more {
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(100,160,220,0.15);
  border:1px solid rgba(100,160,220,0.3);
  font-size:0.62rem; color:#5a7aa0;
  font-family:'Noto Sans SC',sans-serif;
  cursor:pointer; flex-shrink:0;
  transition:background 0.18s;
}
.plaza-more:hover { background:rgba(100,160,220,0.25); }

/* 目标卡片 */
.goal-item {
  background:rgba(255,255,255,0.85);
  border:1px solid rgba(180,210,240,0.4);
  border-radius:16px; padding:14px 16px;
  margin-bottom:10px; cursor:pointer;
  transition:box-shadow 0.2s;
}
.goal-item:hover { box-shadow:0 4px 16px rgba(0,80,160,0.12); }
.goal-badge {
  display:inline-flex; align-items:center; gap:3px;
  background:rgba(74,159,212,0.15); border-radius:10px;
  padding:2px 8px; font-size:0.68rem; color:#2a6090;
  font-family:'Noto Sans SC',sans-serif; margin-bottom:6px;
}
.goal-item-text {
  font-size:0.92rem; color:#0e2840; line-height:1.6;
  margin-bottom:10px;
}
.goal-item-actions { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.goal-btn-release {
  flex:1; padding:9px; border:none; border-radius:12px;
  background:rgba(80,140,220,0.75); color:#fff;
  font-size:0.82rem; cursor:pointer; font-family:'Noto Serif SC',serif;
}
.goal-btn-drop {
  flex:1; padding:9px; border:none; border-radius:12px;
  background:rgba(210,160,20,0.85); color:#fff;
  font-size:0.82rem; cursor:pointer; font-family:'Noto Serif SC',serif;
}
.goal-btn-del {
  width:36px; height:36px; border:none; border-radius:50%;
  background:rgba(220,80,80,0.12); color:rgba(200,60,60,0.7);
  font-size:0.9rem; cursor:pointer;
}

/* 头像行 */
.avatar-row { display:flex; align-items:flex-end; padding-top:8px; }
.avatar-bubble {
  width:22px; height:22px; border-radius:50%; flex-shrink:0;
  margin-right:-3px; display:flex; align-items:center; justify-content:center;
  font-size:0.62rem; font-weight:400; font-family:'Noto Serif SC',serif;
  color:#8aaac0; overflow:hidden;
  border:0.5px solid rgba(255,255,255,0.5); position:relative;
}
.avatar-joined {
  font-size:0.7rem; color:#8aaac0; margin-left:8px;
  font-family:'Noto Serif SC',serif; letter-spacing:0.05em;
}

/* ══ 弹窗 ══ */
.overlay {
  position:fixed; inset:0;
  background:rgba(10,30,60,0.35); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:24px 16px;
}
.modal {
  background:rgba(240,248,255,0.95); border-radius:24px;
  width:100%; max-width:400px; aspect-ratio:1/1;
  overflow-y:auto; padding:44px 22px 28px;
  box-shadow:0 12px 48px rgba(0,60,120,0.18);
  position:relative; border:1px solid rgba(255,255,255,0.9);
  animation:popIn 0.25s ease;
}
@keyframes popIn {
  from { transform:scale(0.92); opacity:0; }
  to   { transform:scale(1);    opacity:1; }
}
.modal-close {
  position:absolute; top:14px; right:16px;
  background:rgba(100,160,220,0.1); border:none;
  width:30px; height:30px; border-radius:50%;
  font-size:0.9rem; color:#5a7aa0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.modal-badge {
  display:inline-flex; align-items:center; gap:4px;
  background:rgba(74,159,212,0.12); border-radius:10px;
  padding:3px 10px; font-size:0.68rem; color:#2a6090;
  font-family:'Noto Sans SC',sans-serif; margin-bottom:8px;
}
.modal-goal-text {
  font-size:0.98rem; color:#0e2840; line-height:1.7;
  margin-bottom:18px;
  display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden;
}
.glass-btn {
  width:77px; height:77px; border:none; border-radius:14px;
  background:linear-gradient(145deg,rgba(255,255,255,0.45),rgba(255,255,255,0.15));
  backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 2px 10px rgba(0,60,120,0.08);
  color:#2a6090; font-size:0.62rem; font-family:'Noto Sans SC',sans-serif;
  cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
  justify-self:center;
}
.glass-btn .btn-icon { font-size:1rem; }
.action-btn {
  padding:10px; border:none; border-radius:12px;
  color:#fff; font-size:0.82rem;
  cursor:pointer; font-family:'Noto Serif SC',serif;
}
.btn-release-modal { background:rgba(80,140,220,0.75); }
.btn-drop-modal    { background:rgba(210,160,20,0.85); }
.checkin-scroll-wrap { overflow:hidden; height:66px; position:relative; }
.checkin-scroll {
  display:flex; flex-direction:column;
  animation:scrollUp 7s linear infinite;
}
.checkin-scroll:hover { animation-play-state:paused; }
@keyframes scrollUp {
  0%   { transform:translateY(0); }
  100% { transform:translateY(-50%); }
}
.participant-checkin {
  font-size:0.8rem; color:#2a6090;
  font-family:'Noto Sans SC',sans-serif;
  padding:5px 0; line-height:1.4;
}
</style>

<script>
(function() {
var canvas = document.createElement('canvas');
canvas.id = 'bgCanvas';
canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;';
document.body.insertBefore(canvas, document.body.firstChild);
var ctx = canvas.getContext('2d');
var W, H, t = 0;
const EMOTION_COLORS = [
  {r:144,g:96,b:208},{r:48,g:80,b:176},{r:80,g:110,b:160},
  {r:192,g:96,b:16},{r:192,g:32,b:32},{r:176,g:128,b:0},
  {r:16,g:160,b:144},{r:16,g:160,b:80},{r:74,g:176,b:224},
];
class Bubble {
  constructor(fromBottom) { this.reset(fromBottom); }
  reset(startAtBottom) {
    this.x=Math.random()*W; this.y=startAtBottom?H+20+Math.random()*100:Math.random()*H;
    this.r=2+Math.random()*22; this.vy=-(0.4+Math.random()*1.2);
    this.wobbleAmp=0.4+Math.random()*1.2; this.wobbleFreq=0.8+Math.random()*1.5;
    this.wobblePhase=Math.random()*Math.PI*2; this.opacity=0.20+Math.random()*0.20;
    this.life=0; this.maxLife=(H+200)/Math.abs(this.vy)*(0.7+Math.random()*0.5);
    this.vy*=(0.8+this.r/30); this.color=EMOTION_COLORS[Math.floor(Math.random()*EMOTION_COLORS.length)];
  }
  update(t) {
    this.life++; this.x+=Math.sin(t*this.wobbleFreq+this.wobblePhase)*this.wobbleAmp; this.y+=this.vy;
    const p=this.life/this.maxLife;
    if(p<0.08) this.opacity=(p/0.08)*(0.25+Math.random()*0.01);
    else if(p>0.85) this.opacity*=0.97;
    if(this.y<-this.r*3||this.life>this.maxLife) this.reset(true);
  }
  draw() {
    const x=this.x,y=this.y,r=this.r,a=this.opacity,{r:cr,g:cg,b:cb}=this.color;
    const glow=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.2);
    glow.addColorStop(0,`rgba(${cr},${cg},${cb},${a*0.65})`);
    glow.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    const shell=ctx.createRadialGradient(x-r*0.32,y-r*0.32,r*0.01,x,y,r);
    shell.addColorStop(0.00,`rgba(255,255,255,${a*0.70})`);
    shell.addColorStop(0.12,`rgba(255,255,255,${a*0.15})`);
    shell.addColorStop(0.55,`rgba(${cr},${cg},${cb},${a*0.48})`);
    shell.addColorStop(0.82,`rgba(${cr},${cg},${cb},${a*0.62})`);
    shell.addColorStop(1.00,`rgba(${cr},${cg},${cb},${a*0.75})`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shell;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${a*0.90})`;ctx.lineWidth=Math.max(0.5,r*0.06);ctx.stroke();
    const sp=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x-r*0.30,y-r*0.30,r*0.32);
    sp.addColorStop(0,`rgba(255,255,255,${Math.min(1,a*1.6)})`);sp.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();
    const sp2=ctx.createRadialGradient(x+r*0.38,y+r*0.30,0,x+r*0.38,y+r*0.30,r*0.14);
    sp2.addColorStop(0,`rgba(255,255,255,${a*0.38})`);sp2.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sp2;ctx.fill();
  }
}
const BUBBLES=Array.from({length:55},(_,i)=>new Bubble(i>20));
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function draw(){
  requestAnimationFrame(draw);t+=0.01;ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#cdeeff');bg.addColorStop(0.4,'#a8d8f0');
  bg.addColorStop(0.7,'#7abde0');bg.addColorStop(1,'#4a8fbf');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  BUBBLES.forEach(function(b){b.update(t);b.draw();});
}
window.addEventListener('resize',resize);resize();draw();
})();
</script>

<script>

function readGoalsUserFromStorage() {
  try {
    var raw = localStorage.getItem('sb-ryoaxziysgdkjcjiuqti-auth-token');
    if (!raw) return null;
    var obj = JSON.parse(raw);
    var token = obj && obj.access_token;
    if (!token) return null;
    var parts = token.split('.');
    if (parts.length !== 3) return null;
    var payload = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
    if (!payload || !payload.sub) return null;
    if (payload.exp && payload.exp * 1000 < Date.now()) return null;
    return { id: payload.sub, email: payload.email || '', token: token };
  } catch(_) { return null; }
}
function getGoals() {
  try { return JSON.parse(localStorage.getItem('freed-goals') || '[]'); } catch(e) { return []; }
}
function saveGoals(g) {
  try { localStorage.setItem('freed-goals', JSON.stringify(g)); } catch(e) {}
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  var el = document.getElementById('goalsToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'goalsToast';
    el.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(10,40,80,0.85);color:#fff;padding:10px 20px;border-radius:99px;font-size:0.85rem;z-index:9999;transition:opacity 0.4s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.opacity = '0'; }, 2500);
}
function selectGoalCat(btn) {
  goalSelectedCat = btn.dataset.cat;
  document.querySelectorAll('#goalCats .gain-cat').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

async function supaFetch(path, opts) {
  opts = opts || {};
  var token = SUPA_KEY;
  if (opts.useAuth) {
    var u = readGoalsUserFromStorage();
    if (u && u.token) token = u.token;
    delete opts.useAuth;
  }
  var res = await fetch(SUPA_URL + path, Object.assign({}, opts, {
    headers: Object.assign({'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=representation'}, opts.headers || {})
  }));
  if (!res.ok) return null;
  var ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}
async function loadGoalsFromCloud() {
  var u = readGoalsUserFromStorage();
  if (!u) return null;
  var rows = await supaFetch('/rest/v1/user_goals?user_id=eq.'+u.id+'&select=*&order=ts.desc', {useAuth:true});
  if (!rows) return null;
  return rows.map(function(r) { return {id:r.id,text:r.text,cat:r.cat||'其他',ts:r.ts}; });
}
async function addGoalToCloud(text, cat) {
  var u = readGoalsUserFromStorage();
  if (!u) return null;
  var ts = Date.now();
  var rows = await supaFetch('/rest/v1/user_goals', {method:'POST',body:JSON.stringify({user_id:u.id,text:text,cat:cat,ts:ts}),useAuth:true});
  if (rows && rows.length > 0) { var r=rows[0]; return {id:r.id,text:r.text,cat:r.cat||'其他',ts:r.ts}; }
  return {text:text,cat:cat,ts:ts};
}
async function deleteGoalFromCloud(cloudId) {
  if (!cloudId) return false;
  await supaFetch('/rest/v1/user_goals?id=eq.'+encodeURIComponent(cloudId), {method:'DELETE',useAuth:true});
  return true;
}

async function addGoal() {
  var input = document.getElementById('goalInput');
  var text = input.value.trim();
  if (!text) return;
  var existingGoals = getGoals();
  if (existingGoals.length >= 3 && typeof FreedPaywall !== 'undefined') {
    var isPremium = await FreedPaywall.checkPremium();
    if (!isPremium) { input.value = text; FreedPaywall.showPaywall(function() { addGoal(); }); return; }
  }
  input.value = '';
  var u = readGoalsUserFromStorage();
  if (u) {
    var cloud = await addGoalToCloud(text, goalSelectedCat);
    var goals = getGoals();
    goals.unshift({id:cloud&&cloud.id,text:text,cat:goalSelectedCat,ts:cloud&&cloud.ts?cloud.ts:Date.now()});
    saveGoals(goals);
  } else {
    var goals2 = getGoals();
    goals2.unshift({text:text,cat:goalSelectedCat,ts:Date.now()});
    saveGoals(goals2);
  }
  renderGoals();
  showToast('🎯 目标已添加');
}
async function deleteGoal(i) {
  var goals = getGoals(); var goal = goals[i]; if (!goal) return;
  var u = readGoalsUserFromStorage();
  if (u && goal.id) await deleteGoalFromCloud(goal.id);
  goals.splice(i,1); saveGoals(goals); renderGoals();
}
function releaseGoal(i) {
  var goals = getGoals(); var goal = goals[i]; if (!goal) return;
  sessionStorage.setItem('releaseGoalText', goal.text);
  if (goal.id) sessionStorage.setItem('releaseGoalCloudId', goal.id);
  window.location.href = 'desire.html';
}
async function dropGoal(i) {
  var goals = getGoals(); var goal = goals[i]; if (!goal) return;
  var u = readGoalsUserFromStorage();
  var entry = {text:goal.text,cat:goal.cat||'其他',ts:Date.now(),likes:0};
  if (u) entry.user_id = u.id;
  var myItems = [];
  try { myItems = JSON.parse(localStorage.getItem('freed-my-gains')||'[]'); } catch(e) {}
  myItems.unshift({text:goal.text,cat:goal.cat||'其他',ts:entry.ts,likes:0});
  try { localStorage.setItem('freed-my-gains',JSON.stringify(myItems)); } catch(e) {}
  try { await supaFetch('/rest/v1/gain_entries',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(entry),useAuth:!!u}); } catch(_) {}
  if (u && goal.id) { try { await deleteGoalFromCloud(goal.id); } catch(_) {} }
  goals.splice(i,1); saveGoals(goals); renderGoals();
  showToast('✨ 目标已掉落并记录到收获本');
}

  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
function closeOnOverlay(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function openReminder() { document.getElementById('reminderOverlay').style.display = 'flex'; }
function closeReminder() { document.getElementById('reminderOverlay').style.display = 'none'; }
function closeReminderOnOverlay(e) { if (e.target === document.getElementById('reminderOverlay')) closeReminder(); }
function saveReminder() {
