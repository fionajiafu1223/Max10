<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圣多纳释放法 · 识别即释放</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #bae6fd;
  display: block;
  overflow: hidden;
  font-family: 'Noto Sans SC', sans-serif;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(186,230,253,0.6) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(147,217,248,0.5) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
.card {
  position: relative; z-index: 1;
  width: 100vw; height: 100vh;
  background: linear-gradient(170deg, #cff4ff 0%, #bae6fd 45%, #90d8f5 100%);
}

.app-title {
  position: absolute; top: 22px; left: 0; right: 0;
  text-align: center; z-index: 10; pointer-events: none;
}
.app-title h1 {
  font-family: 'ZCOOL XiaoWei', serif; font-size: 14px;
  letter-spacing: 5px; color: rgba(3,105,161,0.65); font-weight: 400;
}
.app-title p {
  font-size: 9px; letter-spacing: 2.5px;
  color: rgba(3,105,161,0.40); margin-top: 4px;
  font-family: 'ZCOOL XiaoWei', serif;
}

.svg-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  overflow: visible;
  z-index: 5;
  pointer-events: none;
}

@keyframes hg1{0%,100%{opacity:0.08}50%{opacity:0.28}}
@keyframes hg2{0%,100%{opacity:0.18}50%{opacity:0.6}}
@keyframes hg3{0%,100%{opacity:0.45}50%{opacity:1}}
@keyframes hcore{0%,100%{opacity:0.55}50%{opacity:1}}
.hg1 { animation: hg1 6s ease-in-out infinite; }
.hg2 { animation: hg2 5s ease-in-out infinite 0.5s; }
.hg3 { animation: hg3 4s ease-in-out infinite 1s; }
.hcore { animation: hcore 4s ease-in-out infinite; }

@keyframes energyBreath1 { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.08); } }
@keyframes energyBreath2 { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.12); } }
@keyframes energyBreath3 { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
.energy-outer { animation: energyBreath1 5s ease-in-out infinite; transform-origin: 183px 425px; transition: opacity 1.5s ease; }
.energy-mid   { animation: energyBreath2 4s ease-in-out infinite 0.4s; transform-origin: 183px 425px; transition: opacity 1.5s ease; }
.energy-core  { animation: energyBreath3 3s ease-in-out infinite 0.8s; transform-origin: 183px 425px; transition: opacity 1.5s ease; }
#energyField.dim .energy-outer { opacity: 0.15 !important; }
#energyField.dim .energy-mid   { opacity: 0.25 !important; }
#energyField.dim .energy-core  { opacity: 0.4 !important; }

.scene {
  position: absolute; inset: 0;
  z-index: 8;
  pointer-events: none;
}

.bubble {
  position: absolute;
  border-radius: 50%;
  cursor: pointer;
  pointer-events: auto;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.95);
  text-align: center;
  line-height: 1.1;
  text-shadow: 0 1px 3px rgba(0,40,80,0.35);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  user-select: none;
  -webkit-user-select: none;
}
.bubble:hover { transform: scale(1.06); }
.bubble:active { transform: scale(0.96); }

.bubble::before {
  content: '';
  position: absolute;
  top: 12%; left: 18%;
  width: 30%; height: 22%;
  border-radius: 50%;
  background: radial-gradient(ellipse at center,
    rgba(255,255,255,0.9) 0%,
    rgba(255,255,255,0.5) 40%,
    rgba(255,255,255,0) 70%);
  filter: blur(2px);
  pointer-events: none;
  z-index: 1;
}
.bubble::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(ellipse at 30% 25%, transparent 35%, rgba(0,30,70,0.18) 90%);
  pointer-events: none;
}

.bubble.bc {
  background: radial-gradient(circle at 32% 28%, #ffd9b8 0%, #f5a888 35%, #d97758 70%, #a04830 100%);
  box-shadow:
    0 8px 24px rgba(180,90,50,0.32),
    inset 0 -8px 18px rgba(120,40,10,0.25),
    inset 0 4px 12px rgba(255,255,255,0.4);
  border: 1.5px solid rgba(255,180,140,0.7);
}
.bubble.ba {
  background: radial-gradient(circle at 32% 28%, #e8d5ff 0%, #c8a8ed 35%, #9c75d4 70%, #6840a0 100%);
  box-shadow:
    0 8px 24px rgba(130,75,180,0.32),
    inset 0 -8px 18px rgba(70,30,110,0.25),
    inset 0 4px 12px rgba(255,255,255,0.4);
  border: 1.5px solid rgba(220,180,255,0.7);
}
.bubble.bs {
  background: radial-gradient(circle at 32% 28%, #b8e8e0 0%, #6ab5b0 35%, #3d8a85 70%, #1e5a58 100%);
  box-shadow:
    0 8px 24px rgba(40,110,105,0.32),
    inset 0 -8px 18px rgba(15,60,55,0.25),
    inset 0 4px 12px rgba(255,255,255,0.4);
  border: 1.5px solid rgba(180,230,225,0.7);
}

.bubble span {
  position: relative;
  z-index: 2;
}

.question {
  position: absolute;
  top: 13%; left: 0; right: 0;
  text-align: center;
  z-index: 12;
  pointer-events: none;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  letter-spacing: 3px;
  color: rgba(3,105,161,0.7);
  opacity: 0;
  animation: questionAppear 1.5s 11s ease forwards;
}

@keyframes questionAppear { to { opacity: 1; } }
.question em {
  font-style: normal;
  color: rgba(3,105,161,0.95);
  font-size: 16px;
}

.instruction {
  position: absolute;
  bottom: 56px; left: 0; right: 0;
  text-align: center;
  z-index: 10;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 11px;
  letter-spacing: 2.5px;
  color: rgba(3,105,161,0.5);
  pointer-events: none;
}
.counter {
  position: absolute;
  bottom: 32px; left: 0; right: 0;
  text-align: center;
  z-index: 10;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(3,105,161,0.45);
  pointer-events: none;
}
.caption {
  position: absolute;
  bottom: 12px; left: 0; right: 0;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}
.caption p {
  font-size: 7.5px;
  letter-spacing: 2.5px;
  color: rgba(3,105,161,0.32);
  font-family: 'ZCOOL XiaoWei', serif;
}

.toast {
  position: fixed;
  bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  color: rgba(3,105,161,0.9);
  padding: 10px 22px;
  border-radius: 99px;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 12px;
  letter-spacing: 2px;
  z-index: 50;
  border: 1px solid rgba(255,255,255,0.85);
  box-shadow: 0 4px 18px rgba(3,80,140,0.15);
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.intro-overlay {
  position: absolute;
  top: 8%; left: 0; right: 0;
  z-index: 15;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  animation: introFade 1.5s 10s ease forwards;
}
.intro-card {
  position: relative;
  text-align: center;
  padding: 0 32px;
}
.intro-card::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(180,225,255,0.4) 0%, transparent 70%);
  pointer-events: none;
  animation: glowPulse 2.5s ease-in-out infinite;
}
.intro-line {
  display: block;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 0.85rem;
  color: rgba(3,105,161,0.85);
  letter-spacing: 0.25em;
  line-height: 2.0;
  opacity: 0;
  transform: translateY(6px);
  position: relative;
  z-index: 2;
}
.intro-line-1 { animation: lineReveal 0.7s 0.3s ease forwards; }
.intro-line-2 { animation: lineReveal 0.7s 0.7s ease forwards; }
.intro-line-3 { animation: lineReveal 0.7s 1.1s ease forwards; }
.intro-divider {
  display: block;
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(3,105,161,0.4), transparent);
  margin: 4px auto;
  opacity: 0;
  animation: lineReveal 0.5s 0.5s ease forwards;
}
@keyframes lineReveal { to { opacity: 1; transform: translateY(0); } }
@keyframes introFade { to { opacity: 0; pointer-events: none; visibility: hidden; } }
@keyframes glowPulse {
  0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
}
</style>
</head>
<body>

<div class="intro-overlay" id="introOverlay">
  <div class="intro-card">
    <span class="intro-line intro-line-1">觉察此刻升起的欲望</span>
    <span class="intro-divider"></span>
    <span class="intro-line intro-line-2">点击身体中飘动的泡泡</span>
    <span class="intro-line intro-line-3">识别即是释放</span>
  </div>
</div>

<div class="app-title">
  <h1>圣 多 纳 释 放 法</h1>
  <p>觉察 · 允许 · 释放</p>
</div>

<div class="question" id="questionEl">此刻是 <em>什么想要</em>？</div>

<div class="card">
  <svg class="svg-canvas" id="sv" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="f1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="f2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
      <filter id="f3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="36"/></filter>
      <radialGradient id="energyGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="#ffd9a8" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#ffaa70" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path class="hg1" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f3)"/>
    <path class="hg2" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f2)"/>
    <path class="hg3" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f1)"/>
    <path class="hcore" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Energy field — breathing core that fades as desires release -->
    <g id="energyField">
      <circle class="energy-outer" cx="183" cy="425" r="105" fill="url(#energyGrad)" filter="url(#f3)"/>
      <circle class="energy-mid" cx="183" cy="425" r="75" fill="url(#energyGrad)" filter="url(#f2)"/>
      <circle class="energy-core" cx="183" cy="425" r="40" fill="url(#energyGrad)" filter="url(#f1)"/>
    </g>
  </svg>

  <div class="scene" id="scene"></div>
</div>


<div class="counter"     id="counter">已释放 0 个欲望</div>
<div class="toast"       id="toast"></div>
<div class="caption"><p>SEDONA METHOD · 觉察它，允许它，释放它</p></div>

<script>
const DESIRES = [
  { key:'control',  label:'想要\n控制', cls:'bc' },
  { key:'approval', label:'想要\n认同', cls:'ba' },
  { key:'safety',   label:'想要\n安全', cls:'bs' },
];

const BUBBLES_PER_DESIRE = 3;

const BODY_REGIONS = {
  head:  { cx: 183, cy: 200, rx: 28,  ry: 30  },
  torso: { cx: 183, cy: 425, rx: 110, ry: 115 },
};

let svgScreenRect = null;
const svgViewBox = { w: 360, h: 640 };

function updateSvgRect() {
  const svg = document.getElementById('sv');
  svgScreenRect = svg.getBoundingClientRect();
}

function getSvgScale() {
  if (!svgScreenRect) updateSvgRect();
  const svgRatio = svgViewBox.w / svgViewBox.h;
  const screenRatio = svgScreenRect.width / svgScreenRect.height;
  let scale, offsetX, offsetY;
  if (screenRatio > svgRatio) {
    scale = svgScreenRect.height / svgViewBox.h;
    offsetX = svgScreenRect.left + (svgScreenRect.width - svgViewBox.w * scale) / 2;
    offsetY = svgScreenRect.top;
  } else {
    scale = svgScreenRect.width / svgViewBox.w;
    offsetX = svgScreenRect.left;
    offsetY = svgScreenRect.top + (svgScreenRect.height - svgViewBox.h * scale) / 2;
  }
  return { scale, offsetX, offsetY };
}

function svgToScreen(svgX, svgY) {
  const { scale, offsetX, offsetY } = getSvgScale();
  return { x: offsetX + svgX * scale, y: offsetY + svgY * scale, scale };
}

function screenToSvg(screenX, screenY) {
  const { scale, offsetX, offsetY } = getSvgScale();
  return { x: (screenX - offsetX) / scale, y: (screenY - offsetY) / scale };
}

function isInsideBody(screenX, screenY) {
  const svg = screenToSvg(screenX, screenY);
  const h = BODY_REGIONS.head;
  const hdx = (svg.x - h.cx) / h.rx;
  const hdy = (svg.y - h.cy) / h.ry;
  if (hdx*hdx + hdy*hdy <= 1) return true;
  const t = BODY_REGIONS.torso;
  const tdx = (svg.x - t.cx) / t.rx;
  const tdy = (svg.y - t.cy) / t.ry;
  return tdx*tdx + tdy*tdy <= 1;
}

function randomPointInBody() {
  const region = BODY_REGIONS.torso;
  const u = Math.random();
  const v = Math.random() * 2 * Math.PI;
  const r = Math.sqrt(u);
  const svgX = region.cx + region.rx * r * Math.cos(v) * 0.6;
  const svgY = region.cy + region.ry * r * Math.sin(v) * 0.6;
  return svgToScreen(svgX, svgY);
}

function bodyConstrainForce(screenX, screenY) {
  const svg = screenToSvg(screenX, screenY);
  const t = BODY_REGIONS.torso;
  const dx = (svg.x - t.cx) / t.rx;
  const dy = (svg.y - t.cy) / t.ry;
  const dist2 = dx*dx + dy*dy;
  if (dist2 > 0.55) {
    const len = Math.sqrt(dist2);
    const target = 0.5;
    const screenScale = getSvgScale().scale;
    const pullX = (t.cx + (svg.x - t.cx) * (target / len) - svg.x) * screenScale;
    const pullY = (t.cy + (svg.y - t.cy) * (target / len) - svg.y) * screenScale;
    return { fx: pullX * 0.025, fy: pullY * 0.025 };
  }
  return { fx: 0, fy: 0 };
}

const sceneEl = document.getElementById('scene');
let idleBubbles = [];
let physicsRaf = null;
let released = 0;

const DAMPING   = 0.985;
const REPULSION = 100;

function physicsTick() {
  for (const b of idleBubbles) {
    if (!b.physicsActive) continue;
    const r = b.sz / 2;

    for (const o of idleBubbles) {
      if (o === b || !o.physicsActive) continue;
      const dx = b.px - o.px;
      const dy = b.py - o.py;
      const dist2 = dx*dx + dy*dy;
      const minDist = r + o.sz/2 + 4;
      if (dist2 < minDist*minDist && dist2 > 0.01) {
        const dist = Math.sqrt(dist2);
        const force = REPULSION * (minDist - dist) / (minDist * dist);
        b.vx += dx * force * 0.001;
        b.vy += dy * force * 0.001;
      }
    }

    const bf = bodyConstrainForce(b.px, b.py);
    b.vx += bf.fx;
    b.vy += bf.fy;

    b.vx += (Math.random() - 0.5) * 0.015;
    b.vy += (Math.random() - 0.5) * 0.015;

    b.vx *= DAMPING;
    b.vy *= DAMPING;
    const spd2 = b.vx*b.vx + b.vy*b.vy;
    if (spd2 > 0.16) { const s = 0.4/Math.sqrt(spd2); b.vx *= s; b.vy *= s; }

    b.px += b.vx;
    b.py += b.vy;

    if (!isInsideBody(b.px, b.py)) {
      const screenT = svgToScreen(BODY_REGIONS.torso.cx, BODY_REGIONS.torso.cy);
      const dx = b.px - screenT.x;
      const dy = b.py - screenT.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len > 0) {
        const t = BODY_REGIONS.torso;
        const screenScale = getSvgScale().scale;
        const maxR = t.rx * screenScale * 0.55;
        const newLen = Math.min(len, maxR);
        b.px = screenT.x + dx / len * newLen;
        b.py = screenT.y + dy / len * newLen;
      }
      b.vx *= -0.3;
      b.vy *= -0.3;
    }

    b.el.style.left = `${(b.px - r) | 0}px`;
    b.el.style.top  = `${(b.py - r) | 0}px`;
  }
  physicsRaf = requestAnimationFrame(physicsTick);
}

function spawnBubble(desire) {
  const baseScale = svgScreenRect ? Math.min(svgScreenRect.width / 360, svgScreenRect.height / 640) : 1;
  const sz = Math.round(60 * Math.max(0.7, baseScale));

  let pos;
  for (let attempt = 0; attempt < 30; attempt++) {
    pos = randomPointInBody();
    let conflict = false;
    for (const o of idleBubbles) {
      const dx = pos.x - o.px;
      const dy = pos.y - o.py;
      if (dx*dx + dy*dy < (sz + o.sz)*(sz + o.sz) * 0.3) {
        conflict = true; break;
      }
    }
    if (!conflict) break;
  }

  const el = document.createElement('div');
  el.className = `bubble ${desire.cls}`;
  el.innerHTML = `<span>${desire.label.replace('\n', '<br>')}</span>`;
  el.style.cssText = `
    width:${sz}px; height:${sz}px;
    left:${pos.x - sz/2}px; top:${pos.y - sz/2}px;
    font-size:${sz > 50 ? 0.72 : 0.62}rem;
    opacity:0;
    transition:opacity 0.6s ease;
  `;
  sceneEl.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; }));

  const entry = {
    el, desire, sz,
    px: pos.x, py: pos.y,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    physicsActive: true,
    clicked: false,
  };
  el.onclick = () => onBubbleClick(entry);
  idleBubbles.push(entry);
  return entry;
}

function onBubbleClick(entry) {
  if (entry.clicked) return;
  entry.clicked = true;
  entry.physicsActive = false;
  idleBubbles = idleBubbles.filter(b => b !== entry);

  const { el, desire, sz } = entry;
  el.style.transition = 'none';
  el.style.left = `${entry.px - sz/2}px`;
  el.style.top  = `${entry.py - sz/2}px`;
  el.style.pointerEvents = 'none';
  el.style.cursor = 'default';

  const label = desire.label.replace('\n', '');
  showToast(`🌸 「${label}」已悄然离去`);

  const currentTop = entry.py - sz/2;
  el.style.zIndex = '18';

  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = 'top 1.9s cubic-bezier(0.22,0.58,0.38,0.96), opacity 1.9s ease';
    el.style.top     = `${currentTop - 600}px`;
    el.style.opacity = '0';
  }));

  setTimeout(() => {
    el.remove();
    released++;
    document.getElementById('counter').textContent = `已释放 ${released} 个欲望`;
    updateEnergyField();
    setTimeout(() => {
      spawnBubble(desire);
      updateEnergyField();
    }, 800);
  }, 1900);
}

function updateEnergyField() {
  const ef = document.getElementById('energyField');
  if (!ef) return;
  const remaining = idleBubbles.length;
  const total = DESIRES.length * BUBBLES_PER_DESIRE;
  const ratio = remaining / total;
  // Fade energy as bubbles released
  ef.style.opacity = 0.3 + ratio * 0.7;
  if (remaining < total / 2) {
    ef.classList.add('dim');
  } else {
    ef.classList.remove('dim');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
}

function spawnInitial() {
  for (const desire of DESIRES) {
    for (let i = 0; i < BUBBLES_PER_DESIRE; i++) {
      setTimeout(() => spawnBubble(desire), i * 200 + Math.random() * 200);
    }
  }
}

window.addEventListener('resize', updateSvgRect);

window.addEventListener('load', () => {
  setTimeout(() => {
    updateSvgRect();
    spawnInitial();
    physicsRaf = requestAnimationFrame(physicsTick);
  }, 100);
});
</script>
