<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes lineReveal { to { opacity: 1; transform: translateY(0); } }

<div class="card">

        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="40%" stop-color="#f0f8ff" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#e0eeff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path class="hg1" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f3)"/>
    <path class="hg2" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f2)"/>
    <path class="hg3" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f1)"/>

<div class="counter"     id="counter">已释放 0 个欲望</div>
<div class="toast"       id="toast"></div>
<div class="caption"><p>SEDONA METHOD · 觉察它，允许它，释放它</p></div>

<script>
const DESIRES = [
  {
    key: 'control', name: '想要控制',
    glow: '#b84040', stroke: '#ffcca0',
    s: ['#ffcca0','#c05030','#7a2010']
  },
  {
    key: 'approval', name: '想要认同',
    glow: '#9050b0', stroke: '#e0b8ff',
    s: ['#e0b8ff','#9050b0','#5a1880']
  },
  {
    key: 'safety', name: '想要安全',
    glow: '#2080a0', stroke: '#a0e0ff',
    s: ['#a0e0ff','#2080a0','#0a4860']
  },
];

const BUBBLES_PER_DESIRE = 2;

const BODY_REGIONS = {
  head:  { cx: 183, cy: 200, rx: 28,  ry: 30  },
  torso: { cx: 183, cy: 425, rx: 135, ry: 130 },
};

let svgScreenRect = null;
const svgViewBox = { w: 360, h: 640 };

function updateSvgRect() {
  const svg = document.getElementById('sv');
  svgScreenRect = svg.getBoundingClientRect();
}

function getSvgScale() {
  if (!svgScreenRect) updateSvgRect();
  const svgRatio = svgViewBox.w / svgViewBox.h;
  const screenRatio = svgScreenRect.width / svgScreenRect.height;
  let scale, offsetX, offsetY;
  if (screenRatio > svgRatio) {
    scale = svgScreenRect.height / svgViewBox.h;
    offsetX = svgScreenRect.left + (svgScreenRect.width - svgViewBox.w * scale) / 2;
    offsetY = svgScreenRect.top;
  } else {
    scale = svgScreenRect.width / svgViewBox.w;
    offsetX = svgScreenRect.left;
    offsetY = svgScreenRect.top + (svgScreenRect.height - svgViewBox.h * scale) / 2;
  }
  return { scale, offsetX, offsetY };
}

function svgToScreen(svgX, svgY) {
  const { scale, offsetX, offsetY } = getSvgScale();
  return { x: offsetX + svgX * scale, y: offsetY + svgY * scale, scale };
}

function screenToSvg(screenX, screenY) {
  const { scale, offsetX, offsetY } = getSvgScale();
  return { x: (screenX - offsetX) / scale, y: (screenY - offsetY) / scale };
}

function isInsideBody(screenX, screenY) {
  const svg = screenToSvg(screenX, screenY);
  const h = BODY_REGIONS.head;
  const hdx = (svg.x - h.cx) / h.rx;
  const hdy = (svg.y - h.cy) / h.ry;
  if (hdx*hdx + hdy*hdy <= 1) return true;
  const t = BODY_REGIONS.torso;
  const tdx = (svg.x - t.cx) / t.rx;
  const tdy = (svg.y - t.cy) / t.ry;
  return tdx*tdx + tdy*tdy <= 1;
}

function randomPointInBody() {
  const region = BODY_REGIONS.torso;
  // Distributed but keep within bounds
  const u = 0.2 + Math.random() * 0.5;  // 20-70% of radius
  const v = Math.random() * 2 * Math.PI;
  const r = Math.sqrt(u);
  const svgX = region.cx + region.rx * r * Math.cos(v) * 0.7;
  const svgY = region.cy + region.ry * r * Math.sin(v) * 0.7;
  return svgToScreen(svgX, svgY);
}

function bodyConstrainForce(screenX, screenY) {
  const svg = screenToSvg(screenX, screenY);
  const t = BODY_REGIONS.torso;
  const dx = (svg.x - t.cx) / t.rx;
  const dy = (svg.y - t.cy) / t.ry;
  const dist2 = dx*dx + dy*dy;
  if (dist2 > 0.85) {
    const len = Math.sqrt(dist2);
    const target = 0.8;
    const screenScale = getSvgScale().scale;
    const pullX = (t.cx + (svg.x - t.cx) * (target / len) - svg.x) * screenScale;
    const pullY = (t.cy + (svg.y - t.cy) * (target / len) - svg.y) * screenScale;
    return { fx: pullX * 0.04, fy: pullY * 0.04 };
  }
  return { fx: 0, fy: 0 };
}

let idleBubbles = [];
let physicsRaf = null;
let released = 0;

const DAMPING   = 0.985;
const REPULSION = 60;

const BUBBLE_R_SVG = 44;  // SVG bubble radius (40 body + 4 buffer)

function physicsTick() {
  for (const b of idleBubbles) {
    if (!b.physicsActive) continue;

    // Repel from other bubbles (SVG coords)
    for (const o of idleBubbles) {
      if (o === b || !o.physicsActive) continue;
      const dx = b.sx - o.sx;
      const dy = b.sy - o.sy;
      const dist2 = dx*dx + dy*dy;
      const minDist = BUBBLE_R_SVG * 2 + 2;
      if (dist2 < minDist*minDist && dist2 > 0.01) {
        const dist = Math.sqrt(dist2);
        const force = 1.5 * (minDist - dist) / (minDist * dist);
        b.vx += dx * force;
        b.vy += dy * force;
      }
    }

    // Body constraint (SVG coords)
    const t = BODY_REGIONS.torso;
    const ndx = (b.sx - t.cx) / t.rx;
    const ndy = (b.sy - t.cy) / t.ry;
    const ndist2 = ndx*ndx + ndy*ndy;
    if (ndist2 > 0.7) {
      const len = Math.sqrt(ndist2);
      const target = 0.6;
      b.vx += ((t.cx + (b.sx - t.cx) * (target / len)) - b.sx) * 0.04;
      b.vy += ((t.cy + (b.sy - t.cy) * (target / len)) - b.sy) * 0.04;
    }

    // Random drift
    b.vx += (Math.random() - 0.5) * 0.05;
    b.vy += (Math.random() - 0.5) * 0.05;

    b.vx *= DAMPING;
    b.vy *= DAMPING;
    const spd2 = b.vx*b.vx + b.vy*b.vy;
    if (spd2 > 0.5) { const s = 0.7/Math.sqrt(spd2); b.vx *= s; b.vy *= s; }

    b.sx += b.vx;
    b.sy += b.vy;

    // Hard clamp - keep inside torso
    const cdx = (b.sx - t.cx) / t.rx;
    const cdy = (b.sy - t.cy) / t.ry;
    const cdist2 = cdx*cdx + cdy*cdy;
    if (cdist2 > 1) {
      const len = Math.sqrt(cdist2);
      b.sx = t.cx + (b.sx - t.cx) / len * 0.95;
      b.sy = t.cy + (b.sy - t.cy) / len * 0.95;
      b.vx *= -0.3; b.vy *= -0.3;
    }

    // Update SVG transform
    b.el.setAttribute('transform', 'translate(' + b.sx.toFixed(2) + ',' + b.sy.toFixed(2) + ')');
  }
  physicsRaf = requestAnimationFrame(physicsTick);
}

const NS = 'http://www.w3.org/2000/svg';
let gradCounter = 0;
const bubblesG = () => document.getElementById('bubblesG');
const dfsEl    = () => document.querySelector('#sv defs');

function mkDesireGrad(s) {
  const id = 'dg' + (gradCounter++);
  const rg = document.createElementNS(NS, 'radialGradient');
  rg.setAttribute('id', id);
  rg.setAttribute('cx', '35%'); rg.setAttribute('cy', '30%'); rg.setAttribute('r', '65%');
  [[s[0], 0.55, '0%'], [s[1], 0.28, '60%'], [s[2], 0.62, '100%']].forEach(([c, o, off]) => {
    const st = document.createElementNS(NS, 'stop');
    st.setAttribute('offset', off);
    st.setAttribute('stop-color', c);
    st.setAttribute('stop-opacity', o);
    rg.appendChild(st);
  });
  dfsEl().appendChild(rg);
  return id;
}

function spawnBubbleAt(desire, svgPos) {
  return _createBubble(desire, svgPos, true);
}

function spawnBubble(desire) {
  // Respawn at random body position - SVG coords
  const region = BODY_REGIONS.torso;
  const u = 0.2 + Math.random() * 0.5;
  const v = Math.random() * 2 * Math.PI;
  const r = Math.sqrt(u);
  const svgX = region.cx + region.rx * r * Math.cos(v) * 0.7;
  const svgY = region.cy + region.ry * r * Math.sin(v) * 0.7;
  return _createBubble(desire, { x: svgX, y: svgY });
}

function _createBubble(desire, svgPos, delayPhysics) {
  const gid = mkDesireGrad(desire.s);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('style', 'cursor:pointer; pointer-events:all; opacity:0; transition:opacity 0.6s ease;');

  // Pulsing outer ring
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('r', '44'); ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke', desire.stroke); ring.setAttribute('stroke-width', '1.2');
  ring.setAttribute('stroke-opacity', '0.5');
  ring.classList.add('desire-ring');
  ring.style.animationDelay = (Math.random() * 1.8) + 's';

  // Glow
  const glC = document.createElementNS(NS, 'circle');
  glC.setAttribute('r', '46'); glC.setAttribute('fill', desire.glow);
  glC.setAttribute('filter', 'url(#fd)'); glC.style.opacity = '0.35';

  // Body (with radial gradient)
  const bod = document.createElementNS(NS, 'circle');
  bod.setAttribute('r', '40'); bod.setAttribute('fill', 'url(#' + gid + ')');

  // Rim stroke
  const rim = document.createElementNS(NS, 'circle');
  rim.setAttribute('r', '40'); rim.setAttribute('fill', 'none');
  rim.setAttribute('stroke', desire.stroke); rim.setAttribute('stroke-width', '1.4');
  rim.setAttribute('stroke-opacity', '0.9');

  // Sparkle dots
  [-10, 10].forEach(dx => {
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', '2'); dot.setAttribute('cx', dx); dot.setAttribute('cy', '-8');
    dot.setAttribute('fill', 'white'); dot.setAttribute('fill-opacity', '0.35');
    g.appendChild(dot);
  });

  // White highlight ellipse 1
  const h1 = document.createElementNS(NS, 'ellipse');
  h1.setAttribute('rx', '12'); h1.setAttribute('ry', '6');
  h1.setAttribute('fill', 'white'); h1.setAttribute('fill-opacity', '0.28');
  h1.setAttribute('transform', 'translate(-10,-13)');

  // Smaller highlight ellipse 2
  const h2 = document.createElementNS(NS, 'ellipse');
  h2.setAttribute('rx', '5'); h2.setAttribute('ry', '2.5');
  h2.setAttribute('fill', 'white'); h2.setAttribute('fill-opacity', '0.18');
  h2.setAttribute('transform', 'translate(8,-10)');

  // Text label - 想要 + 控制/认同/安全
  const tx1 = document.createElementNS(NS, 'text');
  tx1.setAttribute('text-anchor', 'middle'); tx1.setAttribute('y', '-2');
  tx1.setAttribute('font-size', '10');
  tx1.setAttribute('font-family', "'Noto Serif SC',serif");
  tx1.setAttribute('fill', 'white'); tx1.setAttribute('fill-opacity', '0.92');
  tx1.textContent = '想要';

  const tx2 = document.createElementNS(NS, 'text');
  tx2.setAttribute('text-anchor', 'middle'); tx2.setAttribute('y', '12');
  tx2.setAttribute('font-size', '10');
  tx2.setAttribute('font-family', "'Noto Serif SC',serif");
  tx2.setAttribute('fill', 'white'); tx2.setAttribute('fill-opacity', '0.92');
  tx2.textContent = desire.name.replace('想要', '');

  [ring, glC, bod, rim, h1, h2, tx1, tx2].forEach(el => g.appendChild(el));
  g.setAttribute('transform', 'translate(' + svgPos.x + ',' + svgPos.y + ')');
  bubblesG().appendChild(g);

  requestAnimationFrame(() => requestAnimationFrame(() => { g.style.opacity = '1'; }));

  const entry = {
    el: g, desire,
    sx: svgPos.x, sy: svgPos.y,   // SVG coordinates
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    physicsActive: !delayPhysics,
    clicked: false,
  };
  if (delayPhysics) {
    setTimeout(() => { entry.physicsActive = true; }, 1500);
  }
  g.addEventListener('click', () => onBubbleClick(entry));
  idleBubbles.push(entry);
  return entry;
}

function onBubbleClick(entry) {
  if (entry.clicked) return;
  entry.clicked = true;
  entry.physicsActive = false;
  idleBubbles = idleBubbles.filter(b => b !== entry);

  const { el, desire } = entry;
  el.style.pointerEvents = 'none';
  el.style.cursor = 'default';

  showToast('🌸 「' + desire.name + '」已悄然离去');

  // Fly upward and fade (SVG transform)
  const startY = entry.sy;
  const startTime = performance.now();
  const duration = 1900;
  function flyUp(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 2.5);
    const y = startY - eased * 600;
    el.setAttribute('transform', 'translate(' + entry.sx.toFixed(2) + ',' + y.toFixed(2) + ')');
    el.style.opacity = (1 - t).toFixed(3);
    if (t < 1) requestAnimationFrame(flyUp);
  }
  requestAnimationFrame(flyUp);

  setTimeout(() => {
    el.remove();
    released++;
    document.getElementById('counter').textContent = '已释放 ' + released + ' 个欲望';
    updateEnergyField();
    setTimeout(() => {
      spawnBubble(desire);
      updateEnergyField();
    }, 800);
  }, 1900);
}

function updateEnergyField() {
  const ef = document.getElementById('energyField');
  if (!ef) return;
  const remaining = idleBubbles.length;
  const total = DESIRES.length * BUBBLES_PER_DESIRE;
  const ratio = remaining / total;
  // Fade energy as bubbles released
  ef.style.opacity = 0.3 + ratio * 0.7;
  if (remaining < total / 2) {
    ef.classList.add('dim');
  } else {
    ef.classList.remove('dim');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// 6 positions in 2 rows - well-spaced inside torso
const FIXED_POSITIONS = [
  // Upper row (chest)
  { x: 125, y: 380 },
  { x: 241, y: 380 },
  // Middle row
  { x: 183, y: 430 },
  { x: 125, y: 480 },
  // Lower row (belly)
  { x: 241, y: 480 },
  { x: 183, y: 530 },
];

function spawnInitial() {
  // Randomize which desire goes to which position
  const positions = [...FIXED_POSITIONS];
  const allDesires = [];
  for (const d of DESIRES) {
    for (let i = 0; i < BUBBLES_PER_DESIRE; i++) allDesires.push(d);
  }
  // Shuffle desire assignment
  for (let i = allDesires.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allDesires[i], allDesires[j]] = [allDesires[j], allDesires[i]];
  }
  for (let i = 0; i < positions.length; i++) {
    setTimeout(() => spawnBubbleAt(allDesires[i], positions[i]), i * 80);
  }
}

window.addEventListener('resize', updateSvgRect);

window.addEventListener('load', () => {
  setTimeout(() => {
    updateSvgRect();
    spawnInitial();
    physicsRaf = requestAnimationFrame(physicsTick);
  }, 100);
});
</script>
